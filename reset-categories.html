<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Categorías</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl p-6 shadow-lg">
        <h1 class="text-2xl font-bold mb-4">🔄 Actualizar Categorías</h1>
        <p class="text-gray-600 mb-6">Esto actualizará las categorías de gastos para incluir "Otro".</p>
        
        <button id="updateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-lg font-bold mb-4">
            Actualizar Categorías
        </button>
        
        <button id="backBtn" class="w-full bg-gray-600 hover:bg-gray-700 text-white p-4 rounded-lg font-bold">
            Volver a la App
        </button>
        
        <div id="status" class="mt-4 p-4 rounded-lg hidden"></div>
    </div>

    <script>
        const updateBtn = document.getElementById('updateBtn');
        const backBtn = document.getElementById('backBtn');
        const status = document.getElementById('status');

        updateBtn.addEventListener('click', () => {
            try {
                // Actualizar categorías de gastos
                const newCategories = ['Gasolina', 'Comida', 'Lavado', 'Peajes', 'Mantenimiento', 'Otro'];
                localStorage.setItem('expenseCategories', JSON.stringify(newCategories));
                
                status.className = 'mt-4 p-4 rounded-lg bg-green-100 text-green-800';
                status.textContent = '✅ Categorías actualizadas correctamente. Ahora "Otro" está disponible.';
                status.classList.remove('hidden');
                
                updateBtn.textContent = '✅ Actualizado';
                updateBtn.disabled = true;
                updateBtn.className = 'w-full bg-green-600 text-white p-4 rounded-lg font-bold mb-4 cursor-not-allowed';
                
            } catch (error) {
                status.className = 'mt-4 p-4 rounded-lg bg-red-100 text-red-800';
                status.textContent = '❌ Error al actualizar: ' + error.message;
                status.classList.remove('hidden');
            }
        });

        backBtn.addEventListener('click', () => {
            window.location.href = '/';
        });

        // Mostrar categorías actuales
        const currentCategories = JSON.parse(localStorage.getItem('expenseCategories') || '[]');
        if (currentCategories.length > 0) {
            const info = document.createElement('div');
            info.className = 'mt-4 p-4 bg-blue-100 text-blue-800 rounded-lg text-sm';
            info.innerHTML = `
                <strong>Categorías actuales:</strong><br>
                ${currentCategories.join(', ')}
            `;
            document.querySelector('.max-w-md').appendChild(info);
        }
    </script>
</body>
</html>
