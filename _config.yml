# Configuración para GitHub Pages
plugins:
  - jekyll-relative-links

# Incluir archivos que normalmente Jekyll ignora
include:
  - sw.js
  - manifest.json
  - icons/
  - reconciliation/
  - src/
  - tests/
  - .nojekyll

# Configuración de rutas relativas
relative_links:
  enabled: true
  collections: true

# Configuración de archivos estáticos
defaults:
  - scope:
      path: "*.html"
    values:
      layout: null
  - scope:
      path: "*.js"
    values:
      layout: null
  - scope:
      path: "*.json"
    values:
      layout: null