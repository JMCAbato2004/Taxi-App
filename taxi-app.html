<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Control de Taxi - Premium PWA for taxi drivers">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Taxi">

  <title>🚕 Control de Taxi Professional</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            dark: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF para generar PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --primary: #10b981;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .dark .glass {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .loading-spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(16, 185, 129, 0.1);
      border-top: 3px solid #10b981;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ocultar barra de desplazamiento */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animación suave para botones */
    .btn-active:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-dark-bg transition-colors duration-300">
  <!-- Loading Screen -->
  <div id="loading-screen"
    class="fixed inset-0 bg-white dark:bg-dark-bg flex items-center justify-center z-50 transition-opacity duration-500">
    <div class="text-center">
      <div class="text-6xl mb-6 animate-bounce">🚕</div>
      <div class="loading-spinner mb-4"></div>
      <div class="text-gray-600 dark:text-gray-400 font-medium tracking-wide">Iniciando Control de Taxi Pro...</div>
    </div>
  </div>

  <!-- React App Container -->
  <div id="root"></div>

  <!-- Offline Manager -->
  <script src="./offline-manager.js"></script>

  <!-- Configuration -->
  <script src="./config.js"></script>

  <!-- Reconciliation Module - Usando módulos simplificados para depuración -->
  <script src="./reconciliation/types.js"></script>
  <script src="./reconciliation/storage-manager.js"></script>
  <script src="./reconciliation/calculation-engine-simple.js"></script>
  
  <!-- Módulos simplificados (funcionando) -->
  <script src="./reconciliation/service-manager-simple.js"></script>
  <script src="./reconciliation/expense-manager-simple.js"></script>
  <script src="./reconciliation/validation-system-simple.js"></script>
  
  <!-- Módulo de conciliación -->
  <script src="./reconciliation/conciliation-module.js"></script>
  
  <!-- Módulos originales (comentados por errores) -->
  <!-- <script src="./reconciliation/service-manager.js"></script>
  <script src="./reconciliation/expense-manager.js"></script>
  <script src="./reconciliation/validation-system.js"></script>
  <script src="./reconciliation/reconciliation-generator.js"></script>
  <script src="./reconciliation/cash-calculator.js"></script>
  <script src="./reconciliation/reconciliation-table.js"></script>
  <script src="./reconciliation/report-exporter.js"></script>
  <script src="./reconciliation/mobile-optimizations.js"></script>
  <script src="./reconciliation/desktop-optimizations.js"></script> -->
  
  <!-- Módulos funcionales -->
  <script src="./reconciliation/reconciliation-module-functional.js"></script>
  <script src="./reconciliation/reconciliation-module-debug-v2.js"></script>

  <!-- Main App (Sin JSX - React puro) -->
  <script>
    const { useState, useEffect, createElement: e } = React;

    const TAXI_PLATFORMS = getConfig('taxiPlatforms', ['Emisora', 'Calle', 'Uber', 'Cabify', 'Freenow', 'Bolt', 'Didi', 'Otro']);
    const INCOME_SOURCES = getConfig('incomeSources', ['Tienda Física', 'Venta Online', 'Servicios', 'Otro']);
    const DEFAULT_EXPENSE_CATEGORIES = getConfig('expenseCategories', ['Gasolina', 'Comida', 'Lavado', 'Mantenimiento']);

    function SalesControlApp() {
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('darkMode');
        return saved ? JSON.parse(saved) : false;
      });

      const [view, setView] = useState('reconciliation');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncStatus, setSyncStatus] = useState(null);

      const [incomes, setIncomes] = useState(() => {
        const saved = localStorage.getItem('incomes');
        return saved ? JSON.parse(saved) : [];
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('expenses');
        return saved ? JSON.parse(saved) : [];
      });

      const [expenseCategories, setExpenseCategories] = useState(() => {
        const saved = localStorage.getItem('expenseCategories');
        if (saved) {
          const savedCategories = JSON.parse(saved);
          // Merge existing categories with new default categories
          const mergedCategories = [...new Set([...savedCategories, ...DEFAULT_EXPENSE_CATEGORIES])];
          // Update localStorage if categories were merged
          if (mergedCategories.length !== savedCategories.length) {
            localStorage.setItem('expenseCategories', JSON.stringify(mergedCategories));
          }
          return mergedCategories;
        }
        return DEFAULT_EXPENSE_CATEGORIES;
      });

      useEffect(() => {
        localStorage.setItem('darkMode', JSON.stringify(darkMode));
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('incomes', JSON.stringify(incomes));
      }, [incomes]);

      useEffect(() => {
        localStorage.setItem('expenses', JSON.stringify(expenses));
      }, [expenses]);

      useEffect(() => {
        localStorage.setItem('expenseCategories', JSON.stringify(expenseCategories));
      }, [expenseCategories]);

      // Manejar conectividad
      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        const handleOfflineManagerUpdate = (event) => {
          const { event: eventType, data } = event.detail;

          switch (eventType) {
            case 'sync_start':
              setSyncStatus('Sincronizando datos...');
              break;
            case 'sync_complete':
              setSyncStatus(`Sincronización completa: ${data.successful}/${data.total} elementos`);
              setTimeout(() => setSyncStatus(null), 3000);
              break;
            case 'sync_error':
              setSyncStatus(`Error de sincronización: ${data}`);
              setTimeout(() => setSyncStatus(null), 5000);
              break;
            default:
              break;
          }
        };

        window.addEventListener('offlineManagerUpdate', handleOfflineManagerUpdate);

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
          window.removeEventListener('offlineManagerUpdate', handleOfflineManagerUpdate);
        };
      }, []);

      const showOfflineNotification = (message) => {
        const notification = document.createElement('div');
        notification.className = 'fixed top-20 left-4 right-4 bg-orange-600 text-white p-4 rounded-lg shadow-lg z-50 transform transition-transform duration-300 -translate-y-full';
        notification.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="text-xl">📡</div>
                <div class="flex-1">
                  <div class="font-bold">Modo Offline</div>
                  <div class="text-sm opacity-90">${message}</div>
                </div>
              </div>
            `;

        document.body.appendChild(notification);

        setTimeout(() => {
          notification.classList.remove('-translate-y-full');
        }, 100);

        setTimeout(() => {
          notification.classList.add('-translate-y-full');
          setTimeout(() => {
            if (notification.parentNode) {
              notification.parentNode.removeChild(notification);
            }
          }, 300);
        }, 4000);
      };

      const addIncome = (income) => {
        const newIncome = { ...income, id: Date.now() };

        if (navigator.onLine) {
          setIncomes([...incomes, newIncome]);
          setView('home');
        } else {
          if (window.offlineManager) {
            window.offlineManager.saveOfflineData('income', newIncome, 'create');
            setIncomes([...incomes, newIncome]);
            setView('home');
            showOfflineNotification('Ingreso guardado offline. Se sincronizará cuando haya conexión.');
          }
        }
      };

      const deleteIncome = (id) => {
        if (window.confirm('¿Seguro que quieres eliminar este ingreso?')) {
          const incomeToDelete = incomes.find(s => s.id === id);

          if (navigator.onLine) {
            setIncomes(incomes.filter(s => s.id !== id));
          } else {
            if (window.offlineManager && incomeToDelete) {
              window.offlineManager.saveOfflineData('income', incomeToDelete, 'delete');
              setIncomes(incomes.filter(s => s.id !== id));
              showOfflineNotification('Ingreso eliminado offline. Se sincronizará cuando haya conexión.');
            }
          }
        }
      };

      const addExpense = (expense) => {
        const newExpense = { ...expense, id: Date.now(), timestamp: new Date().toISOString() };

        if (navigator.onLine) {
          setExpenses([...expenses, newExpense]);
          setView('home');
        } else {
          if (window.offlineManager) {
            window.offlineManager.saveOfflineData('expense', newExpense, 'create');
            setExpenses([...expenses, newExpense]);
            setView('home');
            showOfflineNotification('Gasto guardado offline. Se sincronizará cuando haya conexión.');
          }
        }
      };

      const theme = {
        bg: darkMode ? 'bg-dark-bg' : 'bg-gray-50',
        card: darkMode ? 'bg-dark-card/80 glass' : 'bg-white shadow-sm',
        text: darkMode ? 'text-gray-100' : 'text-gray-900',
        textSecondary: darkMode ? 'text-gray-400' : 'text-gray-600',
        border: darkMode ? 'border-dark-border' : 'border-gray-100',
        input: darkMode ? 'bg-slate-800 text-white' : 'bg-gray-50 text-gray-900',
        primary: 'text-primary-600 dark:text-primary-400',
        accent: 'bg-primary-600 hover:bg-primary-700 text-white shadow-lg shadow-primary-500/30'
      };

      return e('div', { className: `min-h-screen ${theme.bg} ${theme.text} font-sans transition-colors duration-300` },
        // Header
        e('div', { className: `${theme.card} border-b ${theme.border} p-4 sticky top-0 z-30 transition-all` },
          e('div', { className: "flex justify-between items-center max-w-4xl mx-auto" },
            e('div', { className: "flex items-center gap-3" },
              e('div', { className: "text-3xl" }, '🚕'),
              e('div', null,
                e('h1', { className: "text-xl font-bold tracking-tight" }, getConfig('appName', 'Control de Taxi')),
                e('div', { className: "flex items-center gap-2" },
                  !isOnline ? e('div', { className: "flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider bg-orange-500/10 text-orange-500 px-2 py-0.5 rounded-full" },
                    e('span', { className: "w-1.5 h-1.5 bg-orange-500 rounded-full animate-pulse" }),
                    'Offline'
                  ) : e('div', { className: "flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-500 px-2 py-0.5 rounded-full" },
                    e('span', { className: "w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse" }),
                    'En Línea'
                  )
                )
              )
            ),
            e('div', { className: "flex items-center gap-2" },
              syncStatus && e('div', { className: "hidden md:flex items-center gap-2 text-xs font-medium text-blue-500 animate-fade-in" },
                e('span', { className: "w-1.5 h-1.5 bg-blue-500 rounded-full animate-spin" }),
                syncStatus
              ),
              e('button', {
                onClick: () => {
                  setDarkMode(!darkMode);
                  document.documentElement.classList.toggle('dark');
                },
                className: `p-2.5 rounded-xl ${theme.card} border ${theme.border} transition-all hover:scale-105 active:scale-95`
              }, darkMode ? '☀️' : '🌙')
            )
          )
        ),

        // Main Content
        e('div', { className: "max-w-4xl mx-auto p-4 pb-24" },
          view === 'reconciliation' && e(window.ReconciliationModuleFunctional, {
            theme: theme,
            initialTab: 'services',
            onBack: () => setView('reconciliation')
          }),
          view === 'newIncome' && e(NewIncomeView, {
            theme: theme,
            onSave: addIncome,
            onCancel: () => setView('reconciliation')
          }),
          view === 'newExpense' && e(NewExpenseView, {
            theme: theme,
            categories: expenseCategories,
            onSave: addExpense,
            onCancel: () => setView('reconciliation')
          }),
          view === 'reports' && e(window.ReconciliationModuleFunctional, {
            theme: theme,
            initialTab: 'reconciliation',
            onBack: () => setView('reports')
          }),
          view === 'settings' && e(SettingsView, {
            theme: theme,
            expenseCategories: expenseCategories,
            setExpenseCategories: setExpenseCategories,
            onBack: () => setView('reconciliation')
          })
        ),

        // Navigation - Conciliación en lugar de Reportes
        e('div', { className: `fixed bottom-0 left-0 right-0 ${theme.card} border-t ${theme.border} px-4 pb-6 pt-3 z-30 transition-all` },
          e('div', { className: "max-w-4xl mx-auto grid grid-cols-3 gap-6" },
            e(NavButton, { icon: '🚕', label: "Taxi", active: view === 'reconciliation', onClick: () => setView('reconciliation'), theme: theme }),
            e(NavButton, { icon: '🔄', label: "Conciliación", active: view === 'reports', onClick: () => setView('reports'), theme: theme }),
            e(NavButton, { icon: '⚙️', label: "Ajustes", active: view === 'settings', onClick: () => setView('settings'), theme: theme })
          )
        ),

        // Sin botón flotante - navegación solo por pestañas
      );
    }

    // Componentes auxiliares - Solo los necesarios
    function StatCard({ theme, label, value, icon, color = theme.text }) {
      return e('div', { className: `${theme.card} rounded-2xl p-5 border ${theme.border} relative overflow-hidden group` },
        e('div', { className: "flex flex-col justify-between h-full relative z-10" },
          e('div', { className: "flex justify-between items-start mb-3" },
            e('span', { className: `text-[11px] font-bold uppercase tracking-widest ${theme.textSecondary}` }, label),
            e('span', { className: "text-xl opacity-80 group-hover:scale-110 transition-transform" }, icon)
          ),
          e('div', { className: `text-xl font-black tracking-tighter ${color}` }, value)
        ),
        // Background glow effect
        e('div', { className: `absolute -right-4 -bottom-4 w-16 h-16 rounded-full opacity-5 blur-2xl ${color.replace('text', 'bg')}` })
      );
    }

    function IncomeCard({ income, theme, onDelete }) {
      const total = parseFloat(income.amount || 0);

      return e('div', { className: `p-4 rounded-xl border ${theme.border} group hover:bg-white dark:hover:bg-slate-800/50 transition-colors` },
        e('div', { className: "flex justify-between items-start" },
          e('div', { className: "flex items-center gap-3" },
            e('div', { className: "w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-lg" }, '💰'),
            e('div', null,
              e('div', { className: "font-bold" }, income.source),
              e('div', { className: `text-[10px] ${theme.textSecondary} flex items-center gap-1 flex-wrap` },
                e('span', null, '📅'),
                new Date(income.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                income.client && e('span', { className: "mx-1" }, '•'),
                income.client && e('span', { className: "truncate max-w-[100px]" }, `👤 ${income.client}`),
                income.description && e('span', { className: "mx-1" }, '•'),
                income.description && e('span', { className: "truncate max-w-[120px]" }, income.description)
              )
            )
          ),
          e('div', { className: "flex flex-col items-end gap-1" },
            e('div', { className: "text-emerald-500 font-extrabold" }, `${getConfig('currency', '€')}${total.toFixed(2)}`),
            onDelete && e('button', {
              onClick: onDelete,
              className: "opacity-0 group-hover:opacity-100 transition-opacity p-1.5 bg-rose-500/10 text-rose-500 rounded-lg"
            }, '🗑️')
          )
        )
      );
    }

    function NavButton({ icon, label, active, onClick, theme }) {
      return e('button', {
        onClick: onClick,
        className: `flex flex-col items-center justify-center p-2.5 rounded-2xl transition-all duration-300 btn-active ${active
          ? 'bg-primary-500/10 text-primary-500 font-bold'
          : `${theme.textSecondary} hover:${theme.text} hover:bg-gray-500/5`
          }`
      },
        e('span', { className: "text-xl mb-1" }, icon),
        e('span', { className: "text-[10px] uppercase tracking-widest font-bold" }, label)
      );
    }

    function NewIncomeView({ theme, onSave, onCancel }) {
      const [formData, setFormData] = useState({
        source: INCOME_SOURCES[0],
        amount: '',
        date: new Date().toISOString().slice(0, 16),
        description: '',
        client: ''
      });

      const [isListening, setIsListening] = useState(false);
      const [speechSupported, setSpeechSupported] = useState(false);

      useEffect(() => {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          setSpeechSupported(true);
        }
      }, []);

      const startVoiceRecognition = () => {
        if (!speechSupported) return;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setFormData({ ...formData, description: transcript });
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const handleSave = () => {
        if (formData.amount) onSave(formData);
        else alert('El importe es obligatorio');
      };

      return e('div', { className: "fade-in max-w-lg mx-auto" },
        e('div', { className: "flex justify-between items-center mb-8" },
          e('h2', { className: "text-2xl font-black tracking-tight" }, 'Nuevo Ingreso'),
          e('button', { onClick: onCancel, className: `p-2 ${theme.card} border ${theme.border} rounded-xl` }, '✕')
        ),

        e('div', { className: "space-y-5" },
          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Fecha y Hora'),
            e('input', {
              type: "datetime-local",
              value: formData.date,
              onChange: (e) => setFormData({ ...formData, date: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} outline-none focus:ring-2 focus:ring-primary-500`
            })
          ),
          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Fuente de Ingreso'),
            e('select', {
              value: formData.source,
              onChange: (e) => setFormData({ ...formData, source: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} text-lg font-medium focus:ring-2 focus:ring-primary-500 outline-none transition-all`
            },
              ...INCOME_SOURCES.map(p => e('option', { key: p, value: p }, p))
            )
          ),

          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Importe (€)'),
            e('input', {
              type: "number",
              step: "0.01",
              value: formData.amount,
              onChange: (e) => setFormData({ ...formData, amount: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} text-2xl font-black focus:ring-2 focus:ring-primary-500 outline-none transition-all`,
              placeholder: "0.00"
            })
          ),

          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Descripción'),
            e('div', { className: "relative" },
              e('textarea', {
                value: formData.description,
                onChange: (e) => setFormData({ ...formData, description: e.target.value }),
                className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} pr-14 focus:ring-2 focus:ring-primary-500 outline-none transition-all`,
                rows: "3",
                placeholder: "Detalle del ingreso..."
              }),
              speechSupported && e('button', {
                type: "button",
                onClick: startVoiceRecognition,
                className: `absolute right-3 top-3 w-10 h-10 rounded-xl flex items-center justify-center transition-all ${isListening ? 'bg-rose-500 text-white animate-pulse' : 'bg-primary-500/10 text-primary-500'
                  }`
              }, '🎤')
            )
          ),

          e('div', { className: "grid grid-cols-1 gap-4" },
            e('div', null,
              e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Cliente'),
              e('input', {
                type: "text",
                value: formData.client,
                onChange: (e) => setFormData({ ...formData, client: e.target.value }),
                className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} focus:ring-2 focus:ring-primary-500 outline-none transition-all`,
                placeholder: "Nombre del cliente"
              })
            )
          ),

          e('button', {
            onClick: handleSave,
            className: `w-full ${theme.accent} p-5 rounded-2xl text-lg font-bold mt-4 transition-all active:scale-[0.98]`
          }, 'Guardar Registro')
        )
      );
    }

    function NewExpenseView({ theme, categories, onSave, onCancel }) {
      const [formData, setFormData] = useState({
        category: categories[0],
        amount: '',
        notes: '',
        timestamp: new Date().toISOString().slice(0, 16)
      });

      const handleSave = () => {
        if (formData.amount && formData.category) onSave(formData);
        else alert('Faltan campos obligatorios');
      };

      return e('div', { className: "fade-in max-w-lg mx-auto" },
        e('div', { className: "flex justify-between items-center mb-8" },
          e('h2', { className: "text-2xl font-black tracking-tight" }, 'Nuevo Gasto'),
          e('button', { onClick: onCancel, className: `p-2 ${theme.card} border ${theme.border} rounded-xl` }, '✕')
        ),

        e('div', { className: "space-y-5" },
          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Fecha y Hora'),
            e('input', {
              type: "datetime-local",
              value: formData.timestamp,
              onChange: (e) => setFormData({ ...formData, timestamp: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} outline-none focus:ring-2 focus:ring-primary-500`
            })
          ),
          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Categoría'),
            e('select', {
              value: formData.category,
              onChange: (e) => setFormData({ ...formData, category: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} text-lg font-medium outline-none`
            },
              ...categories.map(c => e('option', { key: c, value: c }, c))
            )
          ),

          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Importe (€)'),
            e('input', {
              type: "number",
              step: "0.01",
              value: formData.amount,
              onChange: (e) => setFormData({ ...formData, amount: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} text-2xl font-black outline-none`,
              placeholder: "0.00"
            })
          ),

          e('div', null,
            e('label', { className: `block text-xs font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Notas / Descripción'),
            e('textarea', {
              value: formData.notes,
              onChange: (e) => setFormData({ ...formData, notes: e.target.value }),
              className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} outline-none`,
              rows: "4",
              placeholder: "Agrega detalles del gasto..."
            })
          ),

          e('button', {
            onClick: handleSave,
            className: "w-full bg-rose-500 hover:bg-rose-600 text-white p-5 rounded-2xl text-lg font-bold mt-4 shadow-lg shadow-rose-500/20 active:scale-[0.98] transition-all"
          }, 'Guardar Gasto')
        )
      );
    }

    function SettingsView({ theme, expenseCategories, setExpenseCategories, onBack }) {
      const [newCategory, setNewCategory] = useState('');
      const [appName, setAppName] = useState(getConfig('appName', 'Control de Ventas'));
      const [currency, setCurrency] = useState(getConfig('currency', '€'));

      const addCategory = () => {
        if (newCategory.trim() && !expenseCategories.includes(newCategory.trim())) {
          const updatedCategories = [...expenseCategories, newCategory.trim()];
          setExpenseCategories(updatedCategories);
          updateConfig('expenseCategories', updatedCategories);
          setNewCategory('');
        }
      };

      const removeCategory = (category) => {
        if (expenseCategories.length > 1) {
          const updatedCategories = expenseCategories.filter(c => c !== category);
          setExpenseCategories(updatedCategories);
          updateConfig('expenseCategories', updatedCategories);
        }
      };

      const saveAppSettings = () => {
        updateConfig('appName', appName);
        updateConfig('currency', currency);
        alert('Configuración guardada. Recarga la página para aplicar los cambios.');
      };

      return e('div', { className: "space-y-8 fade-in pb-12" },
        e('div', { className: "flex justify-between items-center mb-4" },
          e('h2', { className: "text-2xl font-black tracking-tight" }, 'Ajustes'),
          e('button', { onClick: onBack, className: `p-2 ${theme.card} border ${theme.border} rounded-xl` }, '✕')
        ),

        // General Settings
        e('div', { className: `${theme.card} rounded-3xl p-6 border ${theme.border}` },
          e('h3', { className: "text-xs font-black uppercase tracking-widest mb-6 opacity-60" }, 'General'),
          e('div', { className: "space-y-5" },
            e('div', null,
              e('label', { className: `block text-[10px] font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Nombre del Negocio'),
              e('input', {
                type: "text",
                value: appName,
                onChange: (e) => setAppName(e.target.value),
                className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} focus:ring-2 focus:ring-primary-500 outline-none`
              })
            ),
            e('div', null,
              e('label', { className: `block text-[10px] font-bold uppercase tracking-widest mb-2 ${theme.textSecondary}` }, 'Moneda Principal'),
              e('select', {
                value: currency,
                onChange: (e) => setCurrency(e.target.value),
                className: `w-full p-4 rounded-2xl ${theme.input} border ${theme.border} outline-none`
              },
                e('option', { value: '€' }, 'Euro (€)'),
                e('option', { value: '$' }, 'Dólar ($)'),
                e('option', { value: 'S/' }, 'Sol (S/)'),
                e('option', { value: '$MX' }, 'Peso MX ($MX)')
              )
            ),
            e('button', {
              onClick: saveAppSettings,
              className: `w-full ${theme.accent} p-4 rounded-2xl font-bold transition-all active:scale-[0.98]`
            }, 'Guardar Cambios')
          )
        ),

        // Expense Categories
        e('div', { className: `${theme.card} rounded-3xl p-6 border ${theme.border}` },
          e('h3', { className: "text-xs font-black uppercase tracking-widest mb-6 opacity-60" }, 'Categorías de Gastos'),

          e('div', { className: "flex gap-2 mb-6" },
            e('input', {
              type: "text",
              value: newCategory,
              onChange: (e) => setNewCategory(e.target.value),
              onKeyPress: (e) => e.key === 'Enter' && addCategory(),
              className: `flex-1 p-4 rounded-2xl ${theme.input} border ${theme.border} outline-none`,
              placeholder: "Nueva categoría..."
            }),
            e('button', {
              onClick: addCategory,
              className: "bg-emerald-500 text-white px-6 rounded-2xl font-bold"
            }, '➕')
          ),

          e('div', { className: "grid grid-cols-1 gap-2" },
            ...expenseCategories.map(category =>
              e('div', { key: category, className: `flex justify-between items-center p-4 rounded-2xl border ${theme.border} ${theme.card}` },
                e('span', { className: "font-medium" }, category),
                expenseCategories.length > 1 && e('button', {
                  onClick: () => removeCategory(category),
                  className: "w-8 h-8 rounded-lg bg-rose-500/10 text-rose-500 flex items-center justify-center font-bold"
                }, '×')
              )
            )
          )
        ),

        // Danger Zone
        e('div', { className: `p-6 rounded-3xl border border-rose-500/20 bg-rose-500/5` },
          e('h3', { className: "text-xs font-extrabold uppercase tracking-widest mb-4 text-rose-500" }, 'Zona de Peligro'),
          e('button', {
            onClick: () => {
              if (window.confirm('¿Borrar absolutamente todo? Esta acción es irreversible.')) {
                localStorage.clear();
                window.location.reload();
              }
            },
            className: "w-full bg-rose-500 text-white p-4 rounded-2xl font-bold shadow-lg shadow-rose-500/20 active:scale-[0.98]"
          }, 'Restablecer Aplicación')
        )
      );
    }

    // Renderizar la aplicación inmediatamente
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Cargando aplicación...');
      document.getElementById('loading-screen').style.display = 'none';
      ReactDOM.render(React.createElement(SalesControlApp), document.getElementById('root'));
      console.log('✅ Aplicación cargada exitosamente');
    });

    // Fallback si DOMContentLoaded ya se ejecutó
    if (document.readyState !== 'loading') {
      console.log('🚀 Cargando aplicación (fallback)...');
      document.getElementById('loading-screen').style.display = 'none';
      ReactDOM.render(React.createElement(SalesControlApp), document.getElementById('root'));
      console.log('✅ Aplicación cargada exitosamente');
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js');
          console.log('✅ Service Worker registrado:', registration.scope);
        } catch (error) {
          console.error('❌ Error registrando Service Worker:', error);
        }
      });
    }
  </script>
</body>

</html>
