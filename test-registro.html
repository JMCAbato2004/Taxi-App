<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">🧪 Test de Registro - Código de Patrón</h1>
        
        <!-- Información de usuarios -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">Usuarios Registrados</h2>
            <button onclick="loadUsers()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 mb-4">
                🔄 Recargar Usuarios
            </button>
            <button onclick="clearAllUsers()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 mb-4 ml-2">
                🗑️ Limpiar Todos
            </button>
            <div id="users-list" class="space-y-2"></div>
        </div>

        <!-- Test de registro de patrón -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">1️⃣ Registrar Patrón</h2>
            <form id="patron-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Nombre</label>
                    <input type="text" id="patron-nombre" value="Juan Patrón" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="patron-email" value="patron@test.com" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Teléfono</label>
                    <input type="tel" id="patron-telefono" value="+34666111222" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Contraseña</label>
                    <input type="password" id="patron-password" value="123456" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    Registrar Patrón
                </button>
            </form>
            <div id="patron-result" class="mt-4"></div>
        </div>

        <!-- Test de registro de taxista -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-4">2️⃣ Registrar Taxista</h2>
            <form id="taxista-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Nombre</label>
                    <input type="text" id="taxista-nombre" value="Pedro Taxista" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="taxista-email" value="taxista@test.com" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Teléfono</label>
                    <input type="tel" id="taxista-telefono" value="+34666333444" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Contraseña</label>
                    <input type="password" id="taxista-password" value="123456" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Código de Patrón</label>
                    <input type="text" id="taxista-codigo" placeholder="Pega aquí el código del patrón" required
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    Registrar Taxista
                </button>
            </form>
            <div id="taxista-result" class="mt-4"></div>
        </div>
    </div>

    <script>
        // Servicio de autenticación simplificado
        class TestAuthService {
            constructor() {
                this.users = JSON.parse(localStorage.getItem('taxi_users') || '[]');
            }

            async register(userData) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // Recargar usuarios desde localStorage
                        this.users = JSON.parse(localStorage.getItem('taxi_users') || '[]');
                        
                        console.log('📋 Usuarios actuales:', this.users);
                        
                        // Check if email already exists
                        if (this.users.find(u => u.email === userData.email)) {
                            reject(new Error('El email ya está registrado'));
                            return;
                        }

                        // Validate patron code for taxistas
                        if (userData.rol === 'TAXISTA' && userData.codigoPatron) {
                            console.log('🔍 Buscando patrón con código:', userData.codigoPatron);
                            const patron = this.users.find(u => u.rol === 'PATRON' && u.codigoInvitacion === userData.codigoPatron);
                            console.log('👤 Patrón encontrado:', patron);
                            
                            if (!patron) {
                                reject(new Error('Código de patrón inválido'));
                                return;
                            }
                        }

                        // Create new user
                        const newUser = {
                            id: this.users.length > 0 ? Math.max(...this.users.map(u => u.id)) + 1 : 1,
                            nombre: userData.nombre,
                            email: userData.email,
                            password: userData.password,
                            rol: userData.rol,
                            telefono: userData.telefono,
                            fechaRegistro: new Date().toISOString()
                        };

                        // Add role-specific fields
                        if (userData.rol === 'PATRON') {
                            newUser.codigoInvitacion = this.generateInvitationCode();
                            console.log('🎫 Código de invitación generado:', newUser.codigoInvitacion);
                        } else if (userData.rol === 'TAXISTA') {
                            newUser.numeroTaxista = this.generateTaxistaNumber();
                            newUser.estado = 'independiente';
                            
                            if (userData.codigoPatron) {
                                const patron = this.users.find(u => u.codigoInvitacion === userData.codigoPatron);
                                this.createJoinRequest(newUser.id, patron.id, userData.codigoPatron);
                                newUser.estado = 'solicitando';
                            }
                        }

                        this.users.push(newUser);
                        localStorage.setItem('taxi_users', JSON.stringify(this.users));
                        
                        console.log('✅ Usuario creado:', newUser);

                        const { password: _, ...userWithoutPassword } = newUser;
                        resolve(userWithoutPassword);
                    }, 500);
                });
            }

            createJoinRequest(taxistaId, patronId, codigoPatron) {
                const requests = JSON.parse(localStorage.getItem('taxi_join_requests') || '[]');
                const newRequest = {
                    id: requests.length + 1,
                    taxistaId: taxistaId,
                    patronId: patronId,
                    codigoPatron: codigoPatron,
                    estado: 'pendiente',
                    fechaSolicitud: new Date().toISOString()
                };
                
                requests.push(newRequest);
                localStorage.setItem('taxi_join_requests', JSON.stringify(requests));
                console.log('📨 Solicitud de unión creada:', newRequest);
            }

            generateInvitationCode() {
                return 'PATRON' + Math.random().toString(36).substr(2, 6).toUpperCase();
            }

            generateTaxistaNumber() {
                const existingNumbers = this.users
                    .filter(u => u.rol === 'TAXISTA')
                    .map(u => u.numeroTaxista)
                    .filter(Boolean);
                
                let number = 1;
                while (existingNumbers.includes(`TX${number.toString().padStart(3, '0')}`)) {
                    number++;
                }
                
                return `TX${number.toString().padStart(3, '0')}`;
            }
        }

        const authService = new TestAuthService();

        // Event listeners
        document.getElementById('patron-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                nombre: document.getElementById('patron-nombre').value,
                email: document.getElementById('patron-email').value,
                telefono: document.getElementById('patron-telefono').value,
                password: document.getElementById('patron-password').value,
                rol: 'PATRON'
            };

            try {
                const user = await authService.register(userData);
                document.getElementById('patron-result').innerHTML = `
                    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                        <p class="font-bold">✅ Patrón registrado exitosamente</p>
                        <p class="text-sm mt-2">Nombre: ${user.nombre}</p>
                        <p class="text-sm">Email: ${user.email}</p>
                        <p class="text-sm font-bold">Código de Invitación: ${user.codigoInvitacion}</p>
                        <button onclick="copyCode('${user.codigoInvitacion}')" class="mt-2 bg-blue-500 text-white px-3 py-1 rounded text-sm">
                            📋 Copiar Código
                        </button>
                    </div>
                `;
                loadUsers();
            } catch (error) {
                document.getElementById('patron-result').innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <p class="font-bold">❌ Error</p>
                        <p class="text-sm">${error.message}</p>
                    </div>
                `;
            }
        });

        document.getElementById('taxista-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                nombre: document.getElementById('taxista-nombre').value,
                email: document.getElementById('taxista-email').value,
                telefono: document.getElementById('taxista-telefono').value,
                password: document.getElementById('taxista-password').value,
                rol: 'TAXISTA',
                codigoPatron: document.getElementById('taxista-codigo').value
            };

            try {
                const user = await authService.register(userData);
                document.getElementById('taxista-result').innerHTML = `
                    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                        <p class="font-bold">✅ Taxista registrado exitosamente</p>
                        <p class="text-sm mt-2">Nombre: ${user.nombre}</p>
                        <p class="text-sm">Email: ${user.email}</p>
                        <p class="text-sm">Número: ${user.numeroTaxista}</p>
                        <p class="text-sm">Estado: ${user.estado}</p>
                    </div>
                `;
                loadUsers();
            } catch (error) {
                document.getElementById('taxista-result').innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <p class="font-bold">❌ Error</p>
                        <p class="text-sm">${error.message}</p>
                    </div>
                `;
            }
        });

        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('taxi_users') || '[]');
            const usersList = document.getElementById('users-list');
            
            if (users.length === 0) {
                usersList.innerHTML = '<p class="text-gray-500">No hay usuarios registrados</p>';
                return;
            }

            usersList.innerHTML = users.map(user => `
                <div class="border border-gray-200 rounded-lg p-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-bold">${user.nombre}</p>
                            <p class="text-sm text-gray-600">${user.email}</p>
                            <p class="text-sm">Rol: <span class="font-semibold">${user.rol}</span></p>
                            ${user.rol === 'PATRON' ? `<p class="text-sm">Código: <span class="font-mono font-bold text-blue-600">${user.codigoInvitacion}</span></p>` : ''}
                            ${user.rol === 'TAXISTA' ? `<p class="text-sm">Número: ${user.numeroTaxista}</p>` : ''}
                            ${user.rol === 'TAXISTA' ? `<p class="text-sm">Estado: ${user.estado}</p>` : ''}
                        </div>
                        <span class="px-2 py-1 text-xs rounded ${user.rol === 'PATRON' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">
                            ${user.rol}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function copyCode(code) {
            document.getElementById('taxista-codigo').value = code;
            alert('Código copiado al campo de taxista!');
        }

        function clearAllUsers() {
            if (confirm('¿Estás seguro de que quieres eliminar todos los usuarios?')) {
                localStorage.removeItem('taxi_users');
                localStorage.removeItem('taxi_join_requests');
                loadUsers();
                document.getElementById('patron-result').innerHTML = '';
                document.getElementById('taxista-result').innerHTML = '';
                alert('Todos los usuarios han sido eliminados');
            }
        }

        // Cargar usuarios al inicio
        loadUsers();
    </script>
</body>
</html>
