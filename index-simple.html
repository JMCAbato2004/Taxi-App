<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Control de Taxi - Aplicación PWA para gestionar servicios y gastos de taxi">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Control Taxi">
    
    <title>🚕 Control de Taxi</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- jsPDF para generar PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #059669;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="text-4xl mb-4">🚕</div>
            <div class="loading-spinner mb-4"></div>
            <div class="text-gray-600">Cargando Control de Taxi...</div>
        </div>
    </div>
    
    <!-- React App Container -->
    <div id="root"></div>
    
    <!-- Main App (Sin JSX - React puro) -->
    <script>
        console.log('🚀 Iniciando aplicación...');
        
        const { useState, useEffect, createElement: e } = React;
        
        const PLATFORMS = ['Emisora', 'Calle', 'Uber', 'Freenow', 'Cabify', 'Bolt', 'DiDi', 'Otra'];
        const DEFAULT_EXPENSE_CATEGORIES = ['Gasolina', 'Comida', 'Lavado', 'Peajes', 'Mantenimiento'];

        function TaxiControlApp() {
          console.log('📱 Renderizando TaxiControlApp...');
          
          const [darkMode, setDarkMode] = useState(() => {
            const saved = localStorage.getItem('darkMode');
            return saved ? JSON.parse(saved) : false;
          });
          
          const [view, setView] = useState('home');
          
          const [services, setServices] = useState(() => {
            const saved = localStorage.getItem('services');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [expenses, setExpenses] = useState(() => {
            const saved = localStorage.getItem('expenses');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [expenseCategories, setExpenseCategories] = useState(() => {
            const saved = localStorage.getItem('expenseCategories');
            return saved ? JSON.parse(saved) : DEFAULT_EXPENSE_CATEGORIES;
          });

          useEffect(() => {
            localStorage.setItem('darkMode', JSON.stringify(darkMode));
          }, [darkMode]);

          useEffect(() => {
            localStorage.setItem('services', JSON.stringify(services));
          }, [services]);

          useEffect(() => {
            localStorage.setItem('expenses', JSON.stringify(expenses));
          }, [expenses]);

          useEffect(() => {
            localStorage.setItem('expenseCategories', JSON.stringify(expenseCategories));
          }, [expenseCategories]);

          const addService = (service) => {
            const newService = { ...service, id: Date.now() };
            setServices([...services, newService]);
            setView('home');
          };

          const deleteService = (id) => {
            if (window.confirm('¿Seguro que quieres eliminar este servicio?')) {
              setServices(services.filter(s => s.id !== id));
            }
          };

          const addExpense = (expense) => {
            const newExpense = { ...expense, id: Date.now(), timestamp: new Date().toISOString() };
            setExpenses([...expenses, newExpense]);
            setView('home');
          };

          const getTodayStats = () => {
            const today = new Date().toDateString();
            const todayServices = services.filter(s => 
              new Date(s.startTime).toDateString() === today
            );
            const todayExpenses = expenses.filter(e => 
              new Date(e.timestamp).toDateString() === today
            );

            const income = todayServices.reduce((sum, s) => 
              sum + parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0), 0
            );
            const spent = todayExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

            return {
              services: todayServices.length,
              income: income.toFixed(2),
              expenses: spent.toFixed(2),
              profit: (income - spent).toFixed(2)
            };
          };

          const theme = {
            bg: darkMode ? 'bg-gray-900' : 'bg-gray-50',
            card: darkMode ? 'bg-gray-800' : 'bg-white',
            text: darkMode ? 'text-white' : 'text-gray-900',
            textSecondary: darkMode ? 'text-gray-400' : 'text-gray-600',
            border: darkMode ? 'border-gray-700' : 'border-gray-200',
            input: darkMode ? 'bg-gray-700 text-white' : 'bg-white text-gray-900'
          };

          return e('div', { className: `min-h-screen ${theme.bg} ${theme.text}` },
            // Header
            e('div', { className: `${theme.card} border-b ${theme.border} p-4 sticky top-0 z-10` },
              e('div', { className: "flex justify-between items-center max-w-4xl mx-auto" },
                e('div', { className: "flex items-center gap-3" },
                  e('h1', { className: "text-2xl font-bold" }, '🚕 Control de Taxi')
                ),
                e('button', {
                  onClick: () => setDarkMode(!darkMode),
                  className: "p-2 rounded-lg hover:bg-gray-700"
                }, darkMode ? '☀️' : '🌙')
              )
            ),

            // Main Content
            e('div', { className: "max-w-4xl mx-auto p-4 pb-24" },
              view === 'home' && e(HomeView, {
                theme: theme,
                stats: getTodayStats(),
                setView: setView,
                services: services,
                onDelete: deleteService
              }),
              view === 'newService' && e(NewServiceView, {
                theme: theme,
                onSave: addService,
                onCancel: () => setView('home')
              }),
              view === 'newExpense' && e(NewExpenseView, {
                theme: theme,
                categories: expenseCategories,
                onSave: addExpense,
                onCancel: () => setView('home')
              }),
              view === 'reports' && e(ReportsView, { 
                theme: theme, 
                services: services, 
                expenses: expenses 
              })
            ),

            // Navigation
            e('div', { className: `fixed bottom-0 left-0 right-0 ${theme.card} border-t ${theme.border} p-4` },
              e('div', { className: "max-w-4xl mx-auto grid grid-cols-3 gap-2" },
                e(NavButton, { label: "Inicio", active: view === 'home', onClick: () => setView('home'), theme: theme }),
                e(NavButton, { label: "Reportes", active: view === 'reports', onClick: () => setView('reports'), theme: theme }),
                e(NavButton, { label: "Ajustes", active: view === 'settings', onClick: () => setView('settings'), theme: theme })
              )
            ),

            // Floating Action Button
            view === 'home' && e('button', {
              onClick: () => setView('newService'),
              className: "fixed bottom-24 right-6 bg-green-600 hover:bg-green-700 text-white rounded-full p-6 shadow-2xl transition-transform hover:scale-110"
            }, '➕')
          );
        }

        // Componentes auxiliares
        function HomeView({ theme, stats, setView, services, onDelete }) {
          const today = new Date().toDateString();
          const todayServices = services.filter(s => 
            new Date(s.startTime).toDateString() === today
          ).slice(-5).reverse();

          return e('div', { className: "space-y-6" },
            // Stats Cards
            e('div', { className: "grid grid-cols-2 gap-4" },
              e(StatCard, { theme: theme, label: "Servicios Hoy", value: stats.services }),
              e(StatCard, { theme: theme, label: "Ingresos", value: `€${stats.income}`, color: "text-green-600" }),
              e(StatCard, { theme: theme, label: "Gastos", value: `€${stats.expenses}`, color: "text-red-600" }),
              e(StatCard, { theme: theme, label: "Beneficio", value: `€${stats.profit}`, color: "text-blue-600" })
            ),

            // Recent Services
            todayServices.length > 0 && e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
              e('h3', { className: "text-lg font-bold mb-4" }, 'Últimos Servicios'),
              e('div', { className: "space-y-3" },
                ...todayServices.map(service => 
                  e(ServiceCard, {
                    key: service.id,
                    service: service,
                    theme: theme,
                    onDelete: () => onDelete(service.id)
                  })
                )
              )
            ),

            // Add Expense Button
            e('button', {
              onClick: () => setView('newExpense'),
              className: `w-full ${theme.card} border ${theme.border} rounded-xl p-6 text-left hover:bg-opacity-80`
            },
              e('div', { className: "flex items-center gap-4" },
                e('span', { className: "text-2xl" }, '🧾'),
                e('span', { className: "text-lg font-semibold" }, 'Registrar Gasto')
              )
            )
          );
        }

        function StatCard({ theme, label, value, color = theme.text }) {
          return e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
            e('div', { className: "flex items-center justify-between mb-2" },
              e('span', { className: `text-sm ${theme.textSecondary}` }, label)
            ),
            e('div', { className: `text-2xl font-bold ${color}` }, value)
          );
        }

        function ServiceCard({ service, theme, onDelete }) {
          const total = parseFloat(service.price || 0) + parseFloat(service.tip || 0) + parseFloat(service.extras || 0);
          
          return e('div', { className: `p-4 rounded-lg border ${theme.border}` },
            e('div', { className: "flex justify-between items-start mb-2" },
              e('span', { className: "font-bold" }, service.platform),
              e('div', { className: "flex items-center gap-2" },
                e('span', { className: "text-green-600 font-bold" }, `€${total.toFixed(2)}`),
                onDelete && e('button', { onClick: onDelete, className: "text-red-500 hover:text-red-400 p-1" }, '🗑️')
              )
            ),
            e('div', { className: `text-sm ${theme.textSecondary}` },
              new Date(service.startTime).toLocaleString()
            )
          );
        }

        function NavButton({ label, active, onClick, theme }) {
          return e('button', {
            onClick: onClick,
            className: `flex flex-col items-center justify-center p-3 rounded-lg transition-colors ${
              active 
                ? 'bg-blue-600 text-white' 
                : `${theme.textSecondary} hover:${theme.text} hover:bg-opacity-10 hover:bg-gray-500`
            }`
          },
            e('span', { className: "text-xs font-medium" }, label)
          );
        }

        function NewServiceView({ theme, onSave, onCancel }) {
          const [formData, setFormData] = useState({
            platform: 'Emisora',
            price: '',
            tip: '',
            extras: '',
            startTime: new Date().toISOString().slice(0, 16),
            endTime: new Date().toISOString().slice(0, 16),
            origin: '',
            destination: ''
          });

          const handleSave = () => {
            if (formData.price) {
              onSave(formData);
            } else {
              alert('El precio es obligatorio');
            }
          };

          return e('div', null,
            e('div', { className: "flex justify-between items-center mb-6" },
              e('h2', { className: "text-2xl font-bold" }, 'Nuevo Servicio'),
              e('button', { onClick: onCancel, className: "p-2 hover:bg-gray-700 rounded-lg" }, '❌')
            ),

            e('div', { className: "space-y-4" },
              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Plataforma *'),
                e('select', {
                  value: formData.platform,
                  onChange: (e) => setFormData({ ...formData, platform: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`
                },
                  ...PLATFORMS.map(p => e('option', { key: p, value: p }, p))
                )
              ),

              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Precio (€) *'),
                e('input', {
                  type: "number",
                  step: "0.01",
                  value: formData.price,
                  onChange: (e) => setFormData({ ...formData, price: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`,
                  placeholder: "15.50"
                })
              ),

              e('div', { className: "grid grid-cols-2 gap-4" },
                e('div', null,
                  e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Propina (€)'),
                  e('input', {
                    type: "number",
                    step: "0.01",
                    value: formData.tip,
                    onChange: (e) => setFormData({ ...formData, tip: e.target.value }),
                    className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border}`,
                    placeholder: "2.00"
                  })
                ),
                e('div', null,
                  e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Extras (€)'),
                  e('input', {
                    type: "number",
                    step: "0.01",
                    value: formData.extras,
                    onChange: (e) => setFormData({ ...formData, extras: e.target.value }),
                    className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border}`,
                    placeholder: "3.50"
                  })
                )
              ),

              e('button', {
                onClick: handleSave,
                className: "w-full bg-green-600 hover:bg-green-700 text-white p-5 rounded-xl text-lg font-bold mt-6"
              }, 'Guardar Servicio')
            )
          );
        }

        function NewExpenseView({ theme, categories, onSave, onCancel }) {
          const [formData, setFormData] = useState({
            category: categories[0],
            amount: '',
            notes: ''
          });

          const handleSave = () => {
            if (formData.amount && formData.category) {
              onSave(formData);
            } else {
              alert('El importe y la categoría son obligatorios');
            }
          };

          return e('div', null,
            e('div', { className: "flex justify-between items-center mb-6" },
              e('h2', { className: "text-2xl font-bold" }, 'Nuevo Gasto'),
              e('button', { onClick: onCancel, className: "p-2 hover:bg-gray-700 rounded-lg" }, '❌')
            ),

            e('div', { className: "space-y-4" },
              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Categoría *'),
                e('select', {
                  value: formData.category,
                  onChange: (e) => setFormData({ ...formData, category: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`
                },
                  ...categories.map(c => e('option', { key: c, value: c }, c))
                )
              ),

              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Importe (€) *'),
                e('input', {
                  type: "number",
                  step: "0.01",
                  value: formData.amount,
                  onChange: (e) => setFormData({ ...formData, amount: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`,
                  placeholder: "25.00"
                })
              ),

              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Notas'),
                e('textarea', {
                  value: formData.notes,
                  onChange: (e) => setFormData({ ...formData, notes: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border}`,
                  rows: "3",
                  placeholder: "Detalles del gasto..."
                })
              ),

              e('button', {
                onClick: handleSave,
                className: "w-full bg-red-600 hover:bg-red-700 text-white p-5 rounded-xl text-lg font-bold mt-6"
              }, 'Guardar Gasto')
            )
          );
        }

        function ReportsView({ theme, services, expenses }) {
          return e('div', { className: "space-y-6" },
            e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
              e('h3', { className: "text-lg font-bold mb-4" }, 'Reportes'),
              e('p', { className: theme.textSecondary }, 'Sección de reportes simplificada - funciona correctamente')
            )
          );
        }

        // Renderizar la aplicación inmediatamente
        console.log('🎯 Iniciando renderizado...');
        
        try {
          document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM cargado, ocultando loading...');
            document.getElementById('loading-screen').style.display = 'none';
            console.log('⚛️ Renderizando React...');
            ReactDOM.render(React.createElement(TaxiControlApp), document.getElementById('root'));
            console.log('✅ Aplicación renderizada exitosamente');
          });

          // Fallback si DOMContentLoaded ya se ejecutó
          if (document.readyState !== 'loading') {
            console.log('📄 DOM ya cargado (fallback), ocultando loading...');
            document.getElementById('loading-screen').style.display = 'none';
            console.log('⚛️ Renderizando React (fallback)...');
            ReactDOM.render(React.createElement(TaxiControlApp), document.getElementById('root'));
            console.log('✅ Aplicación renderizada exitosamente (fallback)');
          }
        } catch (error) {
          console.error('❌ Error durante la inicialización:', error);
        }
    </script>
</body>
</html>
