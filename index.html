<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Control de Taxi - Aplicación PWA para gestionar servicios y gastos de taxi">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Control Taxi">
    
    <title>🚕 Control de Taxi</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- jsPDF para generar PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #059669;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="text-4xl mb-4">🚕</div>
            <div class="loading-spinner mb-4"></div>
            <div class="text-gray-600">Cargando Control de Taxi...</div>
        </div>
    </div>
    
    <!-- React App Container -->
    <div id="root"></div>
    
    <!-- Offline Manager -->
    <script src="./offline-manager.js"></script>
    
    <!-- Main App (Sin JSX - React puro) -->
    <script>
        const { useState, useEffect, createElement: e } = React;
        
        const PLATFORMS = ['Emisora', 'Calle', 'Uber', 'Freenow', 'Cabify', 'Bolt', 'DiDi', 'Otra'];
        const DEFAULT_EXPENSE_CATEGORIES = ['Gasolina', 'Comida', 'Lavado', 'Peajes', 'Mantenimiento', 'Otro'];

        function TaxiControlApp() {
          const [darkMode, setDarkMode] = useState(() => {
            const saved = localStorage.getItem('darkMode');
            return saved ? JSON.parse(saved) : false;
          });
          
          const [view, setView] = useState('home');
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          const [syncStatus, setSyncStatus] = useState(null);
          
          const [services, setServices] = useState(() => {
            const saved = localStorage.getItem('services');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [expenses, setExpenses] = useState(() => {
            const saved = localStorage.getItem('expenses');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [expenseCategories, setExpenseCategories] = useState(() => {
            const saved = localStorage.getItem('expenseCategories');
            if (saved) {
              const savedCategories = JSON.parse(saved);
              // Merge existing categories with new default categories
              const mergedCategories = [...new Set([...savedCategories, ...DEFAULT_EXPENSE_CATEGORIES])];
              // Update localStorage if categories were merged
              if (mergedCategories.length !== savedCategories.length) {
                localStorage.setItem('expenseCategories', JSON.stringify(mergedCategories));
              }
              return mergedCategories;
            }
            return DEFAULT_EXPENSE_CATEGORIES;
          });

          useEffect(() => {
            localStorage.setItem('darkMode', JSON.stringify(darkMode));
          }, [darkMode]);

          useEffect(() => {
            localStorage.setItem('services', JSON.stringify(services));
          }, [services]);

          useEffect(() => {
            localStorage.setItem('expenses', JSON.stringify(expenses));
          }, [expenses]);

          useEffect(() => {
            localStorage.setItem('expenseCategories', JSON.stringify(expenseCategories));
          }, [expenseCategories]);

          // Manejar conectividad
          useEffect(() => {
            const handleOnline = () => setIsOnline(true);
            const handleOffline = () => setIsOnline(false);
            
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            
            const handleOfflineManagerUpdate = (event) => {
              const { event: eventType, data } = event.detail;
              
              switch (eventType) {
                case 'sync_start':
                  setSyncStatus('Sincronizando datos...');
                  break;
                case 'sync_complete':
                  setSyncStatus(`Sincronización completa: ${data.successful}/${data.total} elementos`);
                  setTimeout(() => setSyncStatus(null), 3000);
                  break;
                case 'sync_error':
                  setSyncStatus(`Error de sincronización: ${data}`);
                  setTimeout(() => setSyncStatus(null), 5000);
                  break;
                default:
                  break;
              }
            };
            
            window.addEventListener('offlineManagerUpdate', handleOfflineManagerUpdate);
            
            return () => {
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
              window.removeEventListener('offlineManagerUpdate', handleOfflineManagerUpdate);
            };
          }, []);

          const showOfflineNotification = (message) => {
            const notification = document.createElement('div');
            notification.className = 'fixed top-20 left-4 right-4 bg-orange-600 text-white p-4 rounded-lg shadow-lg z-50 transform transition-transform duration-300 -translate-y-full';
            notification.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="text-xl">📡</div>
                <div class="flex-1">
                  <div class="font-bold">Modo Offline</div>
                  <div class="text-sm opacity-90">${message}</div>
                </div>
              </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
              notification.classList.remove('-translate-y-full');
            }, 100);
            
            setTimeout(() => {
              notification.classList.add('-translate-y-full');
              setTimeout(() => {
                if (notification.parentNode) {
                  notification.parentNode.removeChild(notification);
                }
              }, 300);
            }, 4000);
          };

          const addService = (service) => {
            const newService = { ...service, id: Date.now() };
            
            if (navigator.onLine) {
              setServices([...services, newService]);
              setView('home');
            } else {
              if (window.offlineManager) {
                window.offlineManager.saveOfflineData('service', newService, 'create');
                setServices([...services, newService]);
                setView('home');
                showOfflineNotification('Servicio guardado offline. Se sincronizará cuando haya conexión.');
              }
            }
          };

          const deleteService = (id) => {
            if (window.confirm('¿Seguro que quieres eliminar este servicio?')) {
              const serviceToDelete = services.find(s => s.id === id);
              
              if (navigator.onLine) {
                setServices(services.filter(s => s.id !== id));
              } else {
                if (window.offlineManager && serviceToDelete) {
                  window.offlineManager.saveOfflineData('service', serviceToDelete, 'delete');
                  setServices(services.filter(s => s.id !== id));
                  showOfflineNotification('Servicio eliminado offline. Se sincronizará cuando haya conexión.');
                }
              }
            }
          };

          const addExpense = (expense) => {
            const newExpense = { ...expense, id: Date.now(), timestamp: new Date().toISOString() };
            
            if (navigator.onLine) {
              setExpenses([...expenses, newExpense]);
              setView('home');
            } else {
              if (window.offlineManager) {
                window.offlineManager.saveOfflineData('expense', newExpense, 'create');
                setExpenses([...expenses, newExpense]);
                setView('home');
                showOfflineNotification('Gasto guardado offline. Se sincronizará cuando haya conexión.');
              }
            }
          };

          const getTodayStats = () => {
            const today = new Date().toDateString();
            const todayServices = services.filter(s => 
              new Date(s.startTime).toDateString() === today
            );
            const todayExpenses = expenses.filter(e => 
              new Date(e.timestamp).toDateString() === today
            );

            const income = todayServices.reduce((sum, s) => 
              sum + parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0), 0
            );
            const spent = todayExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

            return {
              services: todayServices.length,
              income: income.toFixed(2),
              expenses: spent.toFixed(2),
              profit: (income - spent).toFixed(2)
            };
          };

          const theme = {
            bg: darkMode ? 'bg-gray-900' : 'bg-gray-50',
            card: darkMode ? 'bg-gray-800' : 'bg-white',
            text: darkMode ? 'text-white' : 'text-gray-900',
            textSecondary: darkMode ? 'text-gray-400' : 'text-gray-600',
            border: darkMode ? 'border-gray-700' : 'border-gray-200',
            input: darkMode ? 'bg-gray-700 text-white' : 'bg-white text-gray-900'
          };

          return e('div', { className: `min-h-screen ${theme.bg} ${theme.text}` },
            // Header
            e('div', { className: `${theme.card} border-b ${theme.border} p-4 sticky top-0 z-10` },
              e('div', { className: "flex justify-between items-center max-w-4xl mx-auto" },
                e('div', { className: "flex items-center gap-3" },
                  e('h1', { className: "text-2xl font-bold" }, '🚕 Control de Taxi'),
                  !isOnline && e('div', { className: "flex items-center gap-2 bg-orange-600 text-white px-3 py-1 rounded-full text-sm" },
                    e('div', { className: "w-2 h-2 bg-white rounded-full animate-pulse" }),
                    'Offline'
                  ),
                  syncStatus && e('div', { className: "flex items-center gap-2 bg-blue-600 text-white px-3 py-1 rounded-full text-sm" },
                    e('div', { className: "w-2 h-2 bg-white rounded-full animate-spin" }),
                    syncStatus
                  )
                ),
                e('button', {
                  onClick: () => setDarkMode(!darkMode),
                  className: "p-2 rounded-lg hover:bg-gray-700"
                }, darkMode ? '☀️' : '🌙')
              )
            ),

            // Main Content
            e('div', { className: "max-w-4xl mx-auto p-4 pb-24" },
              view === 'home' && e(HomeView, {
                theme: theme,
                stats: getTodayStats(),
                setView: setView,
                services: services,
                onDelete: deleteService
              }),
              view === 'newService' && e(NewServiceView, {
                theme: theme,
                onSave: addService,
                onCancel: () => setView('home')
              }),
              view === 'newExpense' && e(NewExpenseView, {
                theme: theme,
                categories: expenseCategories,
                onSave: addExpense,
                onCancel: () => setView('home')
              }),
              view === 'reports' && e(ReportsView, { 
                theme: theme, 
                services: services, 
                expenses: expenses,
                expenseCategories: expenseCategories
              })
            ),

            // Navigation
            e('div', { className: `fixed bottom-0 left-0 right-0 ${theme.card} border-t ${theme.border} p-4` },
              e('div', { className: "max-w-4xl mx-auto grid grid-cols-3 gap-2" },
                e(NavButton, { label: "Inicio", active: view === 'home', onClick: () => setView('home'), theme: theme }),
                e(NavButton, { label: "Reportes", active: view === 'reports', onClick: () => setView('reports'), theme: theme }),
                e(NavButton, { label: "Ajustes", active: view === 'settings', onClick: () => setView('settings'), theme: theme })
              )
            ),

            // Floating Action Button
            view === 'home' && e('button', {
              onClick: () => setView('newService'),
              className: "fixed bottom-24 right-6 bg-green-600 hover:bg-green-700 text-white rounded-full p-6 shadow-2xl transition-transform hover:scale-110"
            }, '➕')
          );
        }

        // Componentes auxiliares
        function HomeView({ theme, stats, setView, services, onDelete }) {
          const today = new Date().toDateString();
          const todayServices = services.filter(s => 
            new Date(s.startTime).toDateString() === today
          ).slice(-5).reverse();

          return e('div', { className: "space-y-6" },
            // Stats Cards
            e('div', { className: "grid grid-cols-2 gap-4" },
              e(StatCard, { theme: theme, label: "Servicios Hoy", value: stats.services }),
              e(StatCard, { theme: theme, label: "Ingresos", value: `€${stats.income}`, color: "text-green-600" }),
              e(StatCard, { theme: theme, label: "Gastos", value: `€${stats.expenses}`, color: "text-red-600" }),
              e(StatCard, { theme: theme, label: "Beneficio", value: `€${stats.profit}`, color: "text-blue-600" })
            ),

            // Recent Services
            todayServices.length > 0 && e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
              e('h3', { className: "text-lg font-bold mb-4" }, 'Últimos Servicios'),
              e('div', { className: "space-y-3" },
                ...todayServices.map(service => 
                  e(ServiceCard, {
                    key: service.id,
                    service: service,
                    theme: theme,
                    onDelete: () => onDelete(service.id)
                  })
                )
              )
            ),

            // Add Expense Button
            e('button', {
              onClick: () => setView('newExpense'),
              className: `w-full ${theme.card} border ${theme.border} rounded-xl p-6 text-left hover:bg-opacity-80`
            },
              e('div', { className: "flex items-center gap-4" },
                e('span', { className: "text-2xl" }, '🧾'),
                e('span', { className: "text-lg font-semibold" }, 'Registrar Gasto')
              )
            )
          );
        }

        function StatCard({ theme, label, value, color = theme.text }) {
          return e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
            e('div', { className: "flex items-center justify-between mb-2" },
              e('span', { className: `text-sm ${theme.textSecondary}` }, label)
            ),
            e('div', { className: `text-2xl font-bold ${color}` }, value)
          );
        }

        function ServiceCard({ service, theme, onDelete }) {
          const total = parseFloat(service.price || 0) + parseFloat(service.tip || 0) + parseFloat(service.extras || 0);
          
          return e('div', { className: `p-4 rounded-lg border ${theme.border}` },
            e('div', { className: "flex justify-between items-start mb-2" },
              e('span', { className: "font-bold" }, service.platform),
              e('div', { className: "flex items-center gap-2" },
                e('span', { className: "text-green-600 font-bold" }, `€${total.toFixed(2)}`),
                onDelete && e('button', { onClick: onDelete, className: "text-red-500 hover:text-red-400 p-1" }, '🗑️')
              )
            ),
            e('div', { className: `text-sm ${theme.textSecondary}` },
              new Date(service.startTime).toLocaleString()
            )
          );
        }

        function NavButton({ label, active, onClick, theme }) {
          return e('button', {
            onClick: onClick,
            className: `flex flex-col items-center justify-center p-3 rounded-lg transition-colors ${
              active 
                ? 'bg-blue-600 text-white' 
                : `${theme.textSecondary} hover:${theme.text} hover:bg-opacity-10 hover:bg-gray-500`
            }`
          },
            e('span', { className: "text-xs font-medium" }, label)
          );
        }

        function NewServiceView({ theme, onSave, onCancel }) {
          const [formData, setFormData] = useState({
            platform: 'Emisora',
            price: '',
            tip: '',
            extras: '',
            startTime: new Date().toISOString().slice(0, 16),
            endTime: new Date().toISOString().slice(0, 16),
            origin: '',
            destination: ''
          });

          const handleSave = () => {
            if (formData.price) {
              onSave(formData);
            } else {
              alert('El precio es obligatorio');
            }
          };

          return e('div', null,
            e('div', { className: "flex justify-between items-center mb-6" },
              e('h2', { className: "text-2xl font-bold" }, 'Nuevo Servicio'),
              e('button', { onClick: onCancel, className: "p-2 hover:bg-gray-700 rounded-lg" }, '❌')
            ),

            e('div', { className: "space-y-4" },
              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Plataforma *'),
                e('select', {
                  value: formData.platform,
                  onChange: (e) => setFormData({ ...formData, platform: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`
                },
                  ...PLATFORMS.map(p => e('option', { key: p, value: p }, p))
                )
              ),

              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Precio (€) *'),
                e('input', {
                  type: "number",
                  step: "0.01",
                  value: formData.price,
                  onChange: (e) => setFormData({ ...formData, price: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`,
                  placeholder: "15.50"
                })
              ),

              e('div', { className: "grid grid-cols-2 gap-4" },
                e('div', null,
                  e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Propina (€)'),
                  e('input', {
                    type: "number",
                    step: "0.01",
                    value: formData.tip,
                    onChange: (e) => setFormData({ ...formData, tip: e.target.value }),
                    className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border}`,
                    placeholder: "2.00"
                  })
                ),
                e('div', null,
                  e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Extras (€)'),
                  e('input', {
                    type: "number",
                    step: "0.01",
                    value: formData.extras,
                    onChange: (e) => setFormData({ ...formData, extras: e.target.value }),
                    className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border}`,
                    placeholder: "3.50"
                  })
                )
              ),

              e('button', {
                onClick: handleSave,
                className: "w-full bg-green-600 hover:bg-green-700 text-white p-5 rounded-xl text-lg font-bold mt-6"
              }, 'Guardar Servicio')
            )
          );
        }

        function NewExpenseView({ theme, categories, onSave, onCancel }) {
          const [formData, setFormData] = useState({
            category: categories[0],
            amount: '',
            notes: ''
          });

          const handleSave = () => {
            if (formData.amount && formData.category) {
              onSave(formData);
            } else {
              alert('El importe y la categoría son obligatorios');
            }
          };

          return e('div', null,
            e('div', { className: "flex justify-between items-center mb-6" },
              e('h2', { className: "text-2xl font-bold" }, 'Nuevo Gasto'),
              e('button', { onClick: onCancel, className: "p-2 hover:bg-gray-700 rounded-lg" }, '❌')
            ),

            e('div', { className: "space-y-4" },
              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Categoría *'),
                e('select', {
                  value: formData.category,
                  onChange: (e) => setFormData({ ...formData, category: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`
                },
                  ...categories.map(c => e('option', { key: c, value: c }, c))
                )
              ),

              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Importe (€) *'),
                e('input', {
                  type: "number",
                  step: "0.01",
                  value: formData.amount,
                  onChange: (e) => setFormData({ ...formData, amount: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`,
                  placeholder: "25.00"
                })
              ),

              e('div', null,
                e('label', { className: `block mb-2 ${theme.textSecondary}` }, 'Notas'),
                e('textarea', {
                  value: formData.notes,
                  onChange: (e) => setFormData({ ...formData, notes: e.target.value }),
                  className: `w-full p-4 rounded-lg ${theme.input} border ${theme.border}`,
                  rows: "3",
                  placeholder: "Detalles del gasto..."
                })
              ),

              e('button', {
                onClick: handleSave,
                className: "w-full bg-red-600 hover:bg-red-700 text-white p-5 rounded-xl text-lg font-bold mt-6"
              }, 'Guardar Gasto')
            )
          );
        }

        function ReportsView({ theme, services, expenses, expenseCategories }) {
          const [period, setPeriod] = useState('today');
          const [chartInstances, setChartInstances] = useState({});

          const getDateRange = () => {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            switch (period) {
              case 'today':
                return { start: today, end: new Date(today.getTime() + 86400000) };
              case 'week':
                const weekStart = new Date(today);
                weekStart.setDate(today.getDate() - today.getDay());
                return { start: weekStart, end: now };
              case 'month':
                return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: now };
              default:
                return { start: today, end: new Date(today.getTime() + 86400000) };
            }
          };

          const { start, end } = getDateRange();
          const periodServices = services.filter(s => {
            const date = new Date(s.startTime);
            return date >= start && date <= end;
          });
          const periodExpenses = expenses.filter(e => {
            const date = new Date(e.timestamp);
            return date >= start && date <= end;
          });

          const income = periodServices.reduce((sum, s) => 
            sum + parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0), 0
          );
          const spent = periodExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

          // Datos para gráficos
          const platformData = PLATFORMS.map(platform => {
            const platformServices = periodServices.filter(s => s.platform === platform);
            return {
              platform,
              count: platformServices.length,
              income: platformServices.reduce((sum, s) => 
                sum + parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0), 0
              )
            };
          }).filter(p => p.count > 0);

          const expenseData = expenseCategories.map(category => {
            const categoryExpenses = periodExpenses.filter(e => e.category === category);
            return {
              category,
              amount: categoryExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0)
            };
          }).filter(c => c.amount > 0);

          // Crear gráficos
          useEffect(() => {
            // Limpiar gráficos anteriores
            Object.values(chartInstances).forEach(chart => {
              if (chart) chart.destroy();
            });

            // Gráfico de ingresos por plataforma
            const platformCtx = document.getElementById('platformChart');
            if (platformCtx && platformData.length > 0) {
              const platformChart = new Chart(platformCtx, {
                type: 'doughnut',
                data: {
                  labels: platformData.map(p => p.platform),
                  datasets: [{
                    data: platformData.map(p => p.income),
                    backgroundColor: [
                      '#10B981', '#3B82F6', '#8B5CF6', '#F59E0B',
                      '#EF4444', '#06B6D4', '#84CC16', '#F97316'
                    ],
                    borderWidth: 2,
                    borderColor: theme.bg === 'bg-gray-900' ? '#374151' : '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: {
                      position: 'bottom',
                      labels: {
                        color: theme.bg === 'bg-gray-900' ? '#ffffff' : '#374151',
                        padding: 20
                      }
                    },
                    tooltip: {
                      callbacks: {
                        label: function(context) {
                          return context.label + ': €' + context.parsed.toFixed(2);
                        }
                      }
                    }
                  }
                }
              });

              // Gráfico de gastos por categoría
              const expenseCtx = document.getElementById('expenseChart');
              if (expenseCtx && expenseData.length > 0) {
                const expenseChart = new Chart(expenseCtx, {
                  type: 'bar',
                  data: {
                    labels: expenseData.map(e => e.category),
                    datasets: [{
                      label: 'Gastos (€)',
                      data: expenseData.map(e => e.amount),
                      backgroundColor: '#EF4444',
                      borderColor: '#DC2626',
                      borderWidth: 1
                    }]
                  },
                  options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                      legend: {
                        labels: {
                          color: theme.bg === 'bg-gray-900' ? '#ffffff' : '#374151'
                        }
                      }
                    },
                    scales: {
                      y: {
                        beginAtZero: true,
                        ticks: {
                          color: theme.bg === 'bg-gray-900' ? '#ffffff' : '#374151',
                          callback: function(value) {
                            return '€' + value.toFixed(2);
                          }
                        },
                        grid: {
                          color: theme.bg === 'bg-gray-900' ? '#374151' : '#E5E7EB'
                        }
                      },
                      x: {
                        ticks: {
                          color: theme.bg === 'bg-gray-900' ? '#ffffff' : '#374151'
                        },
                        grid: {
                          color: theme.bg === 'bg-gray-900' ? '#374151' : '#E5E7EB'
                        }
                      }
                    }
                  }
                });

                setChartInstances({ platform: platformChart, expense: expenseChart });
              } else {
                setChartInstances({ platform: platformChart });
              }
            }
          }, [period, services, expenses, theme.bg]);

          const exportToCSV = () => {
            // CSV corregido con separadores adecuados
            const csvRows = [
              ['Fecha', 'Plataforma', 'Precio', 'Propina', 'Extras', 'Total'].join(';'),
              ...periodServices.map(s => [
                new Date(s.startTime).toLocaleString(),
                s.platform,
                (s.price || 0).toString().replace('.', ','),
                (s.tip || 0).toString().replace('.', ','),
                (s.extras || 0).toString().replace('.', ','),
                (parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0)).toFixed(2).replace('.', ',')
              ].join(';'))
            ];

            const csvContent = csvRows.join('\n');
            const BOM = '\uFEFF'; // BOM para UTF-8
            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `servicios_${period}_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          };

          const exportToPDF = async () => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            
            // Título
            pdf.setFontSize(20);
            pdf.text('Reporte de Control de Taxi', 20, 20);
            
            // Período
            const periodText = period === 'today' ? 'Hoy' : 
                              period === 'week' ? 'Esta Semana' : 'Este Mes';
            pdf.setFontSize(14);
            pdf.text(`Período: ${periodText}`, 20, 35);
            pdf.text(`Fecha: ${new Date().toLocaleDateString()}`, 20, 45);
            
            // Estadísticas
            pdf.setFontSize(16);
            pdf.text('Resumen Financiero', 20, 65);
            pdf.setFontSize(12);
            pdf.text(`Servicios realizados: ${periodServices.length}`, 20, 80);
            pdf.text(`Ingresos totales: €${income.toFixed(2)}`, 20, 90);
            pdf.text(`Gastos totales: €${spent.toFixed(2)}`, 20, 100);
            pdf.text(`Beneficio neto: €${(income - spent).toFixed(2)}`, 20, 110);
            
            // Desglose por plataforma
            if (platformData.length > 0) {
              pdf.setFontSize(16);
              pdf.text('Desglose por Plataforma', 20, 130);
              pdf.setFontSize(10);
              
              let yPos = 145;
              platformData.forEach(p => {
                pdf.text(`${p.platform}: ${p.count} servicios - €${p.income.toFixed(2)}`, 20, yPos);
                yPos += 10;
              });
            }
            
            // Capturar gráficos como imágenes
            try {
              const platformCanvas = document.getElementById('platformChart');
              const expenseCanvas = document.getElementById('expenseChart');
              
              if (platformCanvas) {
                const platformImg = platformCanvas.toDataURL('image/png');
                pdf.addPage();
                pdf.setFontSize(16);
                pdf.text('Gráfico: Ingresos por Plataforma', 20, 20);
                pdf.addImage(platformImg, 'PNG', 20, 30, 160, 100);
              }
              
              if (expenseCanvas && expenseData.length > 0) {
                const expenseImg = expenseCanvas.toDataURL('image/png');
                pdf.addPage();
                pdf.setFontSize(16);
                pdf.text('Gráfico: Gastos por Categoría', 20, 20);
                pdf.addImage(expenseImg, 'PNG', 20, 30, 160, 100);
              }
            } catch (error) {
              console.warn('No se pudieron capturar los gráficos:', error);
            }
            
            // Tabla de servicios
            if (periodServices.length > 0) {
              pdf.addPage();
              pdf.setFontSize(16);
              pdf.text('Detalle de Servicios', 20, 20);
              pdf.setFontSize(8);
              
              let yPos = 35;
              pdf.text('Fecha', 20, yPos);
              pdf.text('Plataforma', 60, yPos);
              pdf.text('Precio', 100, yPos);
              pdf.text('Propina', 130, yPos);
              pdf.text('Total', 160, yPos);
              
              yPos += 10;
              periodServices.slice(0, 30).forEach(s => { // Máximo 30 servicios
                const total = parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0);
                pdf.text(new Date(s.startTime).toLocaleDateString(), 20, yPos);
                pdf.text(s.platform, 60, yPos);
                pdf.text(`€${(s.price || 0)}`, 100, yPos);
                pdf.text(`€${(s.tip || 0)}`, 130, yPos);
                pdf.text(`€${total.toFixed(2)}`, 160, yPos);
                yPos += 8;
                
                if (yPos > 280) { // Nueva página si es necesario
                  pdf.addPage();
                  yPos = 20;
                }
              });
            }
            
            // Descargar PDF
            pdf.save(`reporte_taxi_${period}_${new Date().toISOString().split('T')[0]}.pdf`);
          };

          return e('div', { className: "space-y-6" },
            // Period Selector
            e('div', { className: "flex gap-2 overflow-x-auto pb-2" },
              e('button', {
                onClick: () => setPeriod('today'),
                className: `px-6 py-3 rounded-lg font-semibold whitespace-nowrap ${
                  period === 'today' ? 'bg-blue-600 text-white' : `${theme.card} border ${theme.border}`
                }`
              }, 'Hoy'),
              e('button', {
                onClick: () => setPeriod('week'),
                className: `px-6 py-3 rounded-lg font-semibold whitespace-nowrap ${
                  period === 'week' ? 'bg-blue-600 text-white' : `${theme.card} border ${theme.border}`
                }`
              }, 'Esta Semana'),
              e('button', {
                onClick: () => setPeriod('month'),
                className: `px-6 py-3 rounded-lg font-semibold whitespace-nowrap ${
                  period === 'month' ? 'bg-blue-600 text-white' : `${theme.card} border ${theme.border}`
                }`
              }, 'Este Mes')
            ),

            // Stats Cards
            e('div', { className: "grid grid-cols-2 gap-4" },
              e(StatCard, { theme: theme, label: "Servicios", value: periodServices.length }),
              e(StatCard, { theme: theme, label: "Ingresos", value: `€${income.toFixed(2)}`, color: "text-green-600" }),
              e(StatCard, { theme: theme, label: "Gastos", value: `€${spent.toFixed(2)}`, color: "text-red-600" }),
              e(StatCard, { theme: theme, label: "Beneficio", value: `€${(income - spent).toFixed(2)}`, color: "text-blue-600" })
            ),

            // Export Buttons
            e('div', { className: "grid grid-cols-2 gap-4" },
              e('button', {
                onClick: exportToCSV,
                className: "bg-green-600 hover:bg-green-700 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2"
              },
                e('span', null, '📊'),
                'Descargar CSV'
              ),
              e('button', {
                onClick: exportToPDF,
                className: "bg-red-600 hover:bg-red-700 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2"
              },
                e('span', null, '📄'),
                'Descargar PDF'
              )
            ),

            // Charts
            platformData.length > 0 && e('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
              // Platform Income Chart
              e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                e('h3', { className: "text-lg font-bold mb-4" }, 'Ingresos por Plataforma'),
                e('div', { className: "relative h-64" },
                  e('canvas', { id: 'platformChart' })
                )
              ),
              
              // Expense Chart (solo si hay gastos)
              expenseData.length > 0 && e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                e('h3', { className: "text-lg font-bold mb-4" }, 'Gastos por Categoría'),
                e('div', { className: "relative h-64" },
                  e('canvas', { id: 'expenseChart' })
                )
              )
            ),

            // Platform Breakdown
            e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
              e('h3', { className: "text-lg font-bold mb-4" }, 'Desglose por Plataforma'),
              e('div', { className: "space-y-3" },
                ...platformData.map(p => 
                  e('div', { 
                    key: p.platform, 
                    className: `p-4 rounded-lg border ${theme.border}` 
                  },
                    e('div', { className: "flex justify-between items-center mb-2" },
                      e('span', { className: "font-bold" }, p.platform),
                      e('span', { className: "text-green-600 font-bold" }, `€${p.income.toFixed(2)}`)
                    ),
                    e('div', { className: `text-sm ${theme.textSecondary}` },
                      `${p.count} servicios`
                    )
                  )
                )
              )
            ),

            // Recent Services List
            periodServices.length > 0 && e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
              e('h3', { className: "text-lg font-bold mb-4" }, 'Servicios del Período'),
              e('div', { className: "space-y-3 max-h-96 overflow-y-auto" },
                ...periodServices.slice(-15).reverse().map(service => 
                  e(ServiceCard, {
                    key: service.id,
                    service: service,
                    theme: theme,
                    onDelete: null // No delete in reports view
                  })
                )
              )
            )
          );
        }

        // Renderizar la aplicación inmediatamente
        document.addEventListener('DOMContentLoaded', () => {
          console.log('🚀 Cargando aplicación...');
          document.getElementById('loading-screen').style.display = 'none';
          ReactDOM.render(React.createElement(TaxiControlApp), document.getElementById('root'));
          console.log('✅ Aplicación cargada exitosamente');
        });

        // Fallback si DOMContentLoaded ya se ejecutó
        if (document.readyState !== 'loading') {
          console.log('🚀 Cargando aplicación (fallback)...');
          document.getElementById('loading-screen').style.display = 'none';
          ReactDOM.render(React.createElement(TaxiControlApp), document.getElementById('root'));
          console.log('✅ Aplicación cargada exitosamente');
        }
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./sw.js');
                    console.log('✅ Service Worker registrado:', registration.scope);
                } catch (error) {
                    console.error('❌ Error registrando Service Worker:', error);
                }
            });
        }
    </script>
</body>
</html>
