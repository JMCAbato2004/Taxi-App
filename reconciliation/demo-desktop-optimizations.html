<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Optimizaciones de Escritorio | Conciliación de Taxista</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos adicionales para la demo */
        .loading-spinner {
            border: 2px solid #f3f4f6;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilos para atajos de teclado */
        .keyboard-shortcut {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .keyboard-shortcut.show {
            opacity: 1;
        }

        /* Indicador de resolución */
        .resolution-indicator {
            position: fixed;
            top: 10px;
            left: 10px;
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 1000;
        }

        /* Estilos para dashboard avanzado */
        .metric-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* Estilos para gráficos */
        .chart-bar {
            transition: all 0.5s ease;
        }

        .chart-bar:hover {
            opacity: 0.8;
        }

        /* Estilos para panel lateral */
        .sidebar-enter {
            transform: translateX(100%);
        }

        .sidebar-enter-active {
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .sidebar-exit {
            transform: translateX(0);
        }

        .sidebar-exit-active {
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Indicador de resolución -->
    <div id="resolutionIndicator" class="resolution-indicator"></div>

    <!-- Indicador de atajos de teclado -->
    <div id="keyboardShortcut" class="keyboard-shortcut"></div>

    <!-- Contenedor principal -->
    <div id="app"></div>

    <!-- Scripts -->
    <script src="desktop-optimizations.js"></script>
    
    <script>
        const { createElement: e, useState, useEffect } = React;

        // Tema por defecto
        const defaultTheme = {
            bg: 'bg-gray-50',
            text: 'text-gray-900',
            textSecondary: 'text-gray-600',
            card: 'bg-white',
            border: 'border-gray-200',
            input: 'bg-white'
        };

        // Componente principal de la demo
        function DesktopOptimizationsDemo() {
            const [currentDemo, setCurrentDemo] = useState('dashboard');
            const [sidebarVisible, setSidebarVisible] = useState(false);
            const [searchValue, setSearchValue] = useState('');

            // Actualizar indicador de resolución
            useEffect(() => {
                const updateResolution = () => {
                    const indicator = document.getElementById('resolutionIndicator');
                    if (indicator) {
                        const width = window.innerWidth;
                        const height = window.innerHeight;
                        const type = width >= 1200 ? 'Desktop' : width >= 768 ? 'Tablet' : 'Mobile';
                        indicator.textContent = `${type} (${width}x${height})`;
                    }
                };

                updateResolution();
                window.addEventListener('resize', updateResolution);
                return () => window.removeEventListener('resize', updateResolution);
            }, []);

            // Atajos de teclado
            const keyboardShortcuts = {
                'ctrl+1': () => {
                    setCurrentDemo('dashboard');
                    showKeyboardShortcut('Dashboard (Ctrl+1)');
                },
                'ctrl+2': () => {
                    setCurrentDemo('multipanel');
                    showKeyboardShortcut('Multi-Panel (Ctrl+2)');
                },
                'ctrl+3': () => {
                    setCurrentDemo('toolbar');
                    showKeyboardShortcut('Toolbar (Ctrl+3)');
                },
                'ctrl+4': () => {
                    setCurrentDemo('sidebar');
                    showKeyboardShortcut('Sidebar (Ctrl+4)');
                },
                'ctrl+h': () => {
                    showKeyboardShortcut('Ayuda: Ctrl+1-4 para demos, Ctrl+S para sidebar');
                },
                'ctrl+s': () => {
                    setSidebarVisible(!sidebarVisible);
                    showKeyboardShortcut(`Sidebar ${!sidebarVisible ? 'Abierto' : 'Cerrado'} (Ctrl+S)`);
                },
                'ctrl+f': () => {
                    const searchInput = document.querySelector('input[placeholder*="Buscar"]');
                    if (searchInput) {
                        searchInput.focus();
                        showKeyboardShortcut('Búsqueda activada (Ctrl+F)');
                    }
                },
                'escape': () => {
                    setSidebarVisible(false);
                    setSearchValue('');
                    showKeyboardShortcut('Cerrar paneles (Escape)');
                }
            };

            // Registrar atajos de teclado
            window.DesktopOptimizations?.useKeyboardShortcuts(keyboardShortcuts);

            // Función para mostrar indicador de atajo
            const showKeyboardShortcut = (text) => {
                const indicator = document.getElementById('keyboardShortcut');
                if (indicator) {
                    indicator.textContent = text;
                    indicator.classList.add('show');
                    setTimeout(() => {
                        indicator.classList.remove('show');
                    }, 2000);
                }
            };

            // Datos de ejemplo
            const sampleData = {
                services: Array.from({ length: 50 }, (_, i) => ({
                    id: i + 1,
                    totalAmount: Math.random() * 100 + 20,
                    date: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
                })),
                expenses: Array.from({ length: 20 }, (_, i) => ({
                    id: i + 1,
                    amount: Math.random() * 50 + 10,
                    date: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
                }))
            };

            return e('div', { className: `min-h-screen ${defaultTheme.bg}` },
                // Header principal
                e(DemoHeader, { 
                    currentDemo, 
                    onDemoChange: setCurrentDemo,
                    onToggleSidebar: () => setSidebarVisible(!sidebarVisible),
                    sidebarVisible
                }),

                // Contenido principal
                e('div', { className: 'flex' },
                    // Contenido de la demo
                    e('div', { className: 'flex-1 p-6' },
                        currentDemo === 'dashboard' && e(DashboardDemo, { 
                            theme: defaultTheme, 
                            data: sampleData 
                        }),
                        currentDemo === 'multipanel' && e(MultiPanelDemo, { 
                            theme: defaultTheme, 
                            data: sampleData 
                        }),
                        currentDemo === 'toolbar' && e(ToolbarDemo, { 
                            theme: defaultTheme,
                            searchValue,
                            onSearchChange: setSearchValue
                        }),
                        currentDemo === 'sidebar' && e(SidebarDemo, { 
                            theme: defaultTheme,
                            data: sampleData
                        })
                    ),

                    // Panel lateral contextual
                    e(window.DesktopOptimizations.ContextualSidebar, {
                        content: getSidebarContent(currentDemo, sampleData),
                        theme: defaultTheme,
                        isVisible: sidebarVisible,
                        onToggle: () => setSidebarVisible(!sidebarVisible)
                    })
                )
            );
        }

        // Header de la demo
        function DemoHeader({ currentDemo, onDemoChange, onToggleSidebar, sidebarVisible }) {
            const demoTitles = {
                dashboard: 'Dashboard Avanzado',
                multipanel: 'Layout Multi-Panel',
                toolbar: 'Barra de Herramientas',
                sidebar: 'Panel Lateral'
            };

            return e('div', { className: 'bg-white border-b border-gray-200 p-4 sticky top-0 z-10' },
                e('div', { className: 'flex justify-between items-center' },
                    e('div', { className: 'flex items-center gap-4' },
                        e('h1', { className: 'text-2xl font-bold text-gray-900' }, 
                            '🖥️ Demo - Optimizaciones de Escritorio'
                        ),
                        e(window.DesktopOptimizations.ContextualHelp, {
                            topic: currentDemo,
                            theme: defaultTheme
                        })
                    ),
                    e('div', { className: 'flex items-center gap-4' },
                        // Navegación de demos
                        e('div', { className: 'flex gap-2' },
                            Object.keys(demoTitles).map(demo =>
                                e('button', {
                                    key: demo,
                                    onClick: () => onDemoChange(demo),
                                    className: `px-4 py-2 rounded-lg font-medium transition-colors ${
                                        currentDemo === demo 
                                            ? 'bg-blue-600 text-white' 
                                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                    }`
                                }, demoTitles[demo])
                            )
                        ),
                        // Toggle sidebar
                        e('button', {
                            onClick: onToggleSidebar,
                            className: `p-2 rounded-lg ${sidebarVisible ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700'} hover:bg-blue-700`
                        }, '📋')
                    )
                ),
                // Indicador de atajos
                e('div', { className: 'mt-2 text-xs text-gray-500' },
                    'Atajos: Ctrl+1-4 (Demos) | Ctrl+S (Sidebar) | Ctrl+F (Buscar) | Ctrl+H (Ayuda) | Esc (Cerrar)'
                )
            );
        }

        // Demo del dashboard avanzado
        function DashboardDemo({ theme, data }) {
            return e('div', { className: 'space-y-6' },
                e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                    e('h2', { className: 'text-xl font-bold mb-4' }, '📊 Dashboard Avanzado'),
                    e('p', { className: `${theme.textSecondary} mb-6` }, 
                        'Dashboard con métricas avanzadas, gráficos y análisis detallado optimizado para escritorio.'
                    )
                ),
                
                e(window.DesktopOptimizations.AdvancedDashboard, {
                    data: data,
                    theme: theme,
                    period: { start: '2024-01-01', end: '2024-01-31' }
                })
            );
        }

        // Demo del layout multi-panel
        function MultiPanelDemo({ theme, data }) {
            const [activePanel, setActivePanel] = useState('overview');

            const panels = [
                {
                    id: 'overview',
                    title: 'Resumen General',
                    icon: '📊',
                    description: 'Vista general de métricas',
                    content: e('div', { className: 'p-6' },
                        e('h3', { className: 'text-lg font-bold mb-4' }, 'Resumen General'),
                        e('div', { className: 'grid grid-cols-2 gap-4' },
                            e('div', { className: 'bg-blue-50 p-4 rounded-lg' },
                                e('div', { className: 'text-2xl font-bold text-blue-600' }, data.services.length),
                                e('div', { className: 'text-sm text-blue-700' }, 'Total Servicios')
                            ),
                            e('div', { className: 'bg-green-50 p-4 rounded-lg' },
                                e('div', { className: 'text-2xl font-bold text-green-600' }, 
                                    `${data.services.reduce((sum, s) => sum + s.totalAmount, 0).toFixed(2)}€`
                                ),
                                e('div', { className: 'text-sm text-green-700' }, 'Ingresos Totales')
                            )
                        )
                    )
                },
                {
                    id: 'services',
                    title: 'Servicios',
                    icon: '🚕',
                    description: 'Gestión de servicios',
                    content: e('div', { className: 'p-6' },
                        e('h3', { className: 'text-lg font-bold mb-4' }, 'Servicios Recientes'),
                        e('div', { className: 'space-y-2' },
                            data.services.slice(0, 10).map(service =>
                                e('div', { key: service.id, className: 'flex justify-between p-2 bg-gray-50 rounded' },
                                    e('span', null, `Servicio #${service.id}`),
                                    e('span', { className: 'font-medium' }, `${service.totalAmount.toFixed(2)}€`)
                                )
                            )
                        )
                    )
                },
                {
                    id: 'analytics',
                    title: 'Análisis',
                    icon: '📈',
                    description: 'Análisis detallado',
                    content: e('div', { className: 'p-6' },
                        e('h3', { className: 'text-lg font-bold mb-4' }, 'Análisis de Tendencias'),
                        e('div', { className: 'bg-gray-50 p-4 rounded-lg' },
                            e('p', { className: 'text-gray-600' }, 'Gráfico de tendencias aquí...'),
                            e('div', { className: 'mt-4 h-32 bg-gradient-to-r from-blue-400 to-green-400 rounded opacity-50' })
                        )
                    )
                }
            ];

            return e('div', { className: 'space-y-6' },
                e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                    e('h2', { className: 'text-xl font-bold mb-4' }, '📐 Layout Multi-Panel'),
                    e('p', { className: `${theme.textSecondary} mb-6` }, 
                        'Layout que aprovecha el espacio adicional en pantallas grandes con paneles laterales y navegación rápida.'
                    )
                ),

                e(window.DesktopOptimizations.MultiPanelLayout, {
                    panels: panels,
                    theme: theme,
                    activePanel: activePanel,
                    onPanelChange: setActivePanel
                })
            );
        }

        // Demo de la barra de herramientas
        function ToolbarDemo({ theme, searchValue, onSearchChange }) {
            const [selectedFilter, setSelectedFilter] = useState('');

            const actions = [
                { label: 'Nuevo', onClick: () => alert('Nuevo elemento'), icon: '➕', shortcut: 'Ctrl+N', className: 'bg-green-600 text-white hover:bg-green-700' },
                { label: 'Guardar', onClick: () => alert('Guardado'), icon: '💾', shortcut: 'Ctrl+S', className: 'bg-blue-600 text-white hover:bg-blue-700' },
                { label: 'Exportar', onClick: () => alert('Exportando'), icon: '📄', shortcut: 'Ctrl+E', className: 'bg-purple-600 text-white hover:bg-purple-700' },
                { label: 'Imprimir', onClick: () => alert('Imprimiendo'), icon: '🖨️', shortcut: 'Ctrl+P', className: 'bg-gray-600 text-white hover:bg-gray-700' }
            ];

            return e('div', { className: 'space-y-6' },
                e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                    e('h2', { className: 'text-xl font-bold mb-4' }, '🔧 Barra de Herramientas Avanzada'),
                    e('p', { className: `${theme.textSecondary} mb-6` }, 
                        'Barra de herramientas con búsqueda avanzada, filtros rápidos y acciones con atajos de teclado.'
                    )
                ),

                e(window.DesktopOptimizations.AdvancedToolbar, {
                    actions: actions,
                    theme: theme,
                    searchValue: searchValue,
                    onSearchChange: onSearchChange
                }),

                // Contenido de ejemplo
                e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                    e('h3', { className: 'text-lg font-bold mb-4' }, 'Contenido Filtrado'),
                    searchValue ? 
                        e('p', { className: theme.textSecondary }, `Mostrando resultados para: "${searchValue}"`) :
                        e('p', { className: theme.textSecondary }, 'Usa la búsqueda (Ctrl+F) para filtrar contenido'),
                    
                    e('div', { className: 'mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4' },
                        Array.from({ length: 6 }, (_, i) => 
                            e('div', { key: i, className: 'p-4 bg-gray-50 rounded-lg' },
                                e('h4', { className: 'font-medium' }, `Elemento ${i + 1}`),
                                e('p', { className: 'text-sm text-gray-600 mt-1' }, 'Descripción del elemento...')
                            )
                        )
                    )
                )
            );
        }

        // Demo del panel lateral
        function SidebarDemo({ theme, data }) {
            return e('div', { className: 'space-y-6' },
                e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                    e('h2', { className: 'text-xl font-bold mb-4' }, '📋 Panel Lateral Contextual'),
                    e('p', { className: `${theme.textSecondary} mb-6` }, 
                        'Panel lateral que muestra información contextual, acciones rápidas y resúmenes relevantes. Usa Ctrl+S para abrir/cerrar.'
                    )
                ),

                e('div', { className: `${theme.card} rounded-xl p-6 border ${theme.border}` },
                    e('h3', { className: 'text-lg font-bold mb-4' }, 'Contenido Principal'),
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                        e('div', null,
                            e('h4', { className: 'font-medium mb-3' }, 'Servicios Recientes'),
                            e('div', { className: 'space-y-2' },
                                data.services.slice(0, 5).map(service =>
                                    e('div', { key: service.id, className: 'flex justify-between p-2 bg-gray-50 rounded' },
                                        e('span', null, `#${service.id}`),
                                        e('span', { className: 'font-medium' }, `${service.totalAmount.toFixed(2)}€`)
                                    )
                                )
                            )
                        ),
                        e('div', null,
                            e('h4', { className: 'font-medium mb-3' }, 'Gastos Recientes'),
                            e('div', { className: 'space-y-2' },
                                data.expenses.slice(0, 5).map(expense =>
                                    e('div', { key: expense.id, className: 'flex justify-between p-2 bg-red-50 rounded' },
                                        e('span', null, `Gasto #${expense.id}`),
                                        e('span', { className: 'font-medium text-red-600' }, `${expense.amount.toFixed(2)}€`)
                                    )
                                )
                            )
                        )
                    ),
                    
                    e('div', { className: 'mt-6 p-4 bg-blue-50 rounded-lg' },
                        e('p', { className: 'text-blue-800 text-sm' },
                            '💡 El panel lateral (derecha) muestra información contextual relevante. Úsalo para acciones rápidas y resúmenes.'
                        )
                    )
                )
            );
        }

        // Función para obtener contenido del sidebar según la demo
        function getSidebarContent(currentDemo, data) {
            const baseContent = {
                summary: [
                    { label: 'Total Servicios', value: data.services.length.toString() },
                    { label: 'Ingresos', value: `${data.services.reduce((sum, s) => sum + s.totalAmount, 0).toFixed(2)}€` },
                    { label: 'Gastos', value: `${data.expenses.reduce((sum, e) => sum + e.amount, 0).toFixed(2)}€` }
                ],
                quickActions: [
                    { label: 'Exportar PDF', onClick: () => alert('Exportando PDF...'), icon: '📄' },
                    { label: 'Nuevo Servicio', onClick: () => alert('Nuevo servicio...'), icon: '🚕' },
                    { label: 'Ver Reportes', onClick: () => alert('Abriendo reportes...'), icon: '📊' }
                ]
            };

            switch (currentDemo) {
                case 'dashboard':
                    return {
                        ...baseContent,
                        info: [
                            'Dashboard con métricas avanzadas y análisis en tiempo real.',
                            'Usa las métricas para identificar tendencias y oportunidades.',
                            'Los gráficos se actualizan automáticamente con nuevos datos.'
                        ]
                    };
                case 'multipanel':
                    return {
                        ...baseContent,
                        info: [
                            'Layout optimizado para pantallas grandes.',
                            'Navegación rápida entre diferentes secciones.',
                            'Aprovecha el espacio disponible de manera eficiente.'
                        ]
                    };
                case 'toolbar':
                    return {
                        ...baseContent,
                        info: [
                            'Barra de herramientas con búsqueda avanzada.',
                            'Filtros rápidos para encontrar información específica.',
                            'Atajos de teclado para mayor productividad.'
                        ]
                    };
                case 'sidebar':
                    return {
                        ...baseContent,
                        info: [
                            'Panel contextual que se adapta al contenido actual.',
                            'Acciones rápidas para tareas comunes.',
                            'Información relevante siempre visible.'
                        ]
                    };
                default:
                    return baseContent;
            }
        }

        // Renderizar la aplicación
        ReactDOM.render(e(DesktopOptimizationsDemo), document.getElementById('app'));

        // Mostrar información inicial
        console.log('🖥️ Demo de Optimizaciones de Escritorio cargada');
        console.log('⌨️ Atajos disponibles:');
        console.log('  Ctrl+1-4: Cambiar entre demos');
        console.log('  Ctrl+S: Abrir/cerrar panel lateral');
        console.log('  Ctrl+F: Activar búsqueda');
        console.log('  Ctrl+H: Mostrar ayuda');
        console.log('  Esc: Cerrar paneles');
    </script>
</body>
</html>
