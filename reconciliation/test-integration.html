<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Módulo de Conciliación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
    <div id="test-root"></div>
    
    <!-- Cargar módulos de conciliación -->
    <script src="./types.js"></script>
    <script src="./calculation-engine.js"></script>
    <script src="./storage-manager.js"></script>
    <script src="./service-manager.js"></script>
    <script src="./reconciliation-module.js"></script>
    
    <!-- Cargar pruebas y demos -->
    <script src="./test-calculation-engine.js"></script>
    <script src="./test-requirements.js"></script>
    <script src="./test-service-manager.js"></script>
    <script src="./test-integration-comprehensive.js"></script>
    <script src="./demo-service-manager.js"></script>
    
    <script>
        const { createElement: e } = React;
        
        // Tema de prueba
        const testTheme = {
            bg: 'bg-gray-50',
            card: 'bg-white',
            text: 'text-gray-900',
            textSecondary: 'text-gray-600',
            border: 'border-gray-200',
            input: 'bg-white text-gray-900'
        };
        
        function TestApp() {
            const [showReconciliation, setShowReconciliation] = React.useState(false);
            
            if (showReconciliation) {
                return e(window.ReconciliationModule, {
                    theme: testTheme,
                    onBack: () => setShowReconciliation(false)
                });
            }
            
            return e('div', { className: "min-h-screen bg-gray-50 p-8" },
                e('div', { className: "max-w-2xl mx-auto" },
                    e('h1', { className: "text-3xl font-bold mb-8" }, '🧪 Test - Módulo de Conciliación'),
                    
                    e('div', { className: "bg-white rounded-xl p-6 border border-gray-200 mb-6" },
                        e('h2', { className: "text-xl font-bold mb-4" }, 'Estado de los Módulos'),
                        e('div', { className: "space-y-2" },
                            e('div', { className: "flex justify-between" },
                                e('span', null, 'Tipos de datos:'),
                                e('span', { className: window.ReconciliationTypes ? 'text-green-600' : 'text-red-600' },
                                    window.ReconciliationTypes ? '✅ Cargado' : '❌ Error'
                                )
                            ),
                            e('div', { className: "flex justify-between" },
                                e('span', null, 'Motor de cálculos:'),
                                e('span', { className: window.CalculationEngine ? 'text-green-600' : 'text-red-600' },
                                    window.CalculationEngine ? '✅ Cargado' : '❌ Error'
                                )
                            ),
                            e('div', { className: "flex justify-between" },
                                e('span', null, 'Gestor de servicios:'),
                                e('span', { className: window.ServiceManager ? 'text-green-600' : 'text-red-600' },
                                    window.ServiceManager ? '✅ Cargado' : '❌ Error'
                                )
                            ),
                            e('div', { className: "flex justify-between" },
                                e('span', null, 'Gestor de almacenamiento:'),
                                e('span', { className: window.ReconciliationStorageManager ? 'text-green-600' : 'text-red-600' },
                                    window.ReconciliationStorageManager ? '✅ Cargado' : '❌ Error'
                                )
                            ),
                            e('div', { className: "flex justify-between" },
                                e('span', null, 'Módulo principal:'),
                                e('span', { className: window.ReconciliationModule ? 'text-green-600' : 'text-red-600' },
                                    window.ReconciliationModule ? '✅ Cargado' : '❌ Error'
                                )
                            )
                        )
                    ),
                    
                    e('div', { className: "bg-white rounded-xl p-6 border border-gray-200 mb-6" },
                        e('h2', { className: "text-xl font-bold mb-4" }, 'Test Básico del Motor de Cálculos'),
                        e('div', { className: "space-y-2 text-sm" },
                            (() => {
                                try {
                                    const engine = new window.CalculationEngine();
                                    const commission = engine.calculateCommission(100, 'freenow');
                                    const distribution = engine.calculateDistribution(100, 0.6);
                                    
                                    return [
                                        e('div', { key: 'test1' }, `Comisión Freenow (100€): ${commission}€`),
                                        e('div', { key: 'test2' }, `Distribución 60% (100€): ${distribution}€`),
                                        e('div', { key: 'test3', className: 'text-green-600' }, '✅ Motor de cálculos funcionando')
                                    ];
                                } catch (error) {
                                    return e('div', { className: 'text-red-600' }, `❌ Error: ${error.message}`);
                                }
                            })()
                        )
                    ),
                    
                    e('div', { className: "bg-white rounded-xl p-6 border border-gray-200 mb-6" },
                        e('h2', { className: "text-xl font-bold mb-4" }, 'Pruebas Disponibles'),
                        e('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                            e('button', {
                                onClick: () => {
                                    console.clear();
                                    if (window.runCalculationEngineTests) {
                                        window.runCalculationEngineTests();
                                    } else {
                                        console.error('Pruebas del CalculationEngine no disponibles');
                                    }
                                },
                                className: "p-4 bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 text-left"
                            },
                                e('div', { className: "font-semibold text-blue-800" }, '🧪 Motor de Cálculos'),
                                e('div', { className: "text-sm text-blue-600" }, 'Pruebas del CalculationEngine')
                            ),
                            e('button', {
                                onClick: () => {
                                    console.clear();
                                    if (window.runRequirementsTests) {
                                        window.runRequirementsTests();
                                    } else {
                                        console.error('Pruebas de requerimientos no disponibles');
                                    }
                                },
                                className: "p-4 bg-green-50 hover:bg-green-100 rounded-lg border border-green-200 text-left"
                            },
                                e('div', { className: "font-semibold text-green-800" }, '📋 Requerimientos'),
                                e('div', { className: "text-sm text-green-600" }, 'Verificación de requerimientos')
                            ),
                            e('button', {
                                onClick: () => {
                                    console.clear();
                                    if (window.runServiceManagerTests) {
                                        window.runServiceManagerTests();
                                    } else {
                                        console.error('Pruebas del ServiceManager no disponibles');
                                    }
                                },
                                className: "p-4 bg-purple-50 hover:bg-purple-100 rounded-lg border border-purple-200 text-left"
                            },
                                e('div', { className: "font-semibold text-purple-800" }, '🚕 ServiceManager'),
                                e('div', { className: "text-sm text-purple-600" }, 'Pruebas de gestión de servicios')
                            ),
                            e('button', {
                                onClick: () => {
                                    console.clear();
                                    if (window.runComprehensiveIntegrationTests) {
                                        window.runComprehensiveIntegrationTests();
                                    } else {
                                        console.error('Pruebas de integración no disponibles');
                                    }
                                },
                                className: "p-4 bg-orange-50 hover:bg-orange-100 rounded-lg border border-orange-200 text-left"
                            },
                                e('div', { className: "font-semibold text-orange-800" }, '🔗 CHECKPOINT'),
                                e('div', { className: "text-sm text-orange-600" }, 'Validación funcionalidad básica')
                            )
                        ),
                        e('p', { className: "text-sm text-gray-600 mt-4" }, 
                            'Abre la consola del navegador (F12) para ver los resultados de las pruebas.'
                        )
                    ),
                    
                    e('div', { className: "bg-white rounded-xl p-6 border border-gray-200 mb-6" },
                        e('h2', { className: "text-xl font-bold mb-4" }, 'Demo y Datos de Prueba'),
                        e('div', { className: "grid grid-cols-1 md:grid-cols-3 gap-4 mb-4" },
                            e('button', {
                                onClick: () => {
                                    console.clear();
                                    if (window.demoServiceManager) {
                                        window.demoServiceManager();
                                    } else {
                                        console.error('Demo del ServiceManager no disponible');
                                    }
                                },
                                className: "p-4 bg-green-50 hover:bg-green-100 rounded-lg border border-green-200 text-left"
                            },
                                e('div', { className: "font-semibold text-green-800" }, '🚕 Cargar Demo'),
                                e('div', { className: "text-sm text-green-600" }, 'Servicios de ejemplo')
                            ),
                            e('button', {
                                onClick: () => {
                                    console.clear();
                                    if (window.showCurrentData) {
                                        window.showCurrentData();
                                    } else {
                                        console.error('Función showCurrentData no disponible');
                                    }
                                },
                                className: "p-4 bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 text-left"
                            },
                                e('div', { className: "font-semibold text-blue-800" }, '📊 Ver Datos'),
                                e('div', { className: "text-sm text-blue-600" }, 'Estado actual')
                            ),
                            e('button', {
                                onClick: () => {
                                    if (window.clearDemoData && confirm('¿Seguro que quieres limpiar todos los datos?')) {
                                        console.clear();
                                        window.clearDemoData();
                                    }
                                },
                                className: "p-4 bg-red-50 hover:bg-red-100 rounded-lg border border-red-200 text-left"
                            },
                                e('div', { className: "font-semibold text-red-800" }, '🧹 Limpiar'),
                                e('div', { className: "text-sm text-red-600" }, 'Borrar todos los datos')
                            )
                        ),
                        e('p', { className: "text-sm text-gray-600" }, 
                            'Usa "Cargar Demo" para añadir servicios de ejemplo, luego abre el módulo de conciliación para probar la funcionalidad completa.'
                        )
                    ),
                    
                    e('button', {
                        onClick: () => setShowReconciliation(true),
                        className: "w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-bold text-lg"
                    }, '🚀 Abrir Módulo de Conciliación')
                )
            );
        }
        
        // Renderizar la aplicación de prueba
        ReactDOM.render(e(TestApp), document.getElementById('test-root'));
    </script>
</body>
</html>
