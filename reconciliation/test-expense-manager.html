<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ExpenseManager - Conciliación de Taxista</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">💰 Test ExpenseManager</h1>
                    <p class="text-gray-600">Prueba completa del componente de gestión de gastos</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="runTests()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold">
                        🧪 Ejecutar Pruebas
                    </button>
                    <button onclick="resetDemo()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-semibold">
                        🔄 Reiniciar Demo
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Área de resultados de pruebas -->
        <div id="test-results" class="mb-6 hidden">
            <div class="bg-white rounded-xl p-6 border border-gray-200">
                <h2 class="text-xl font-bold mb-4">🧪 Resultados de Pruebas</h2>
                <div id="test-output" class="font-mono text-sm bg-gray-50 p-4 rounded-lg overflow-auto max-h-64">
                    <!-- Los resultados se mostrarán aquí -->
                </div>
            </div>
        </div>

        <!-- Demo del ExpenseManager -->
        <div id="expense-manager-demo">
            <!-- El componente se renderizará aquí -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="types.js"></script>
    <script src="expense-manager.js"></script>
    <script src="demo-expense-manager.js"></script>
    <script src="test-expense-manager.js"></script>

    <script>
        // Función para ejecutar las pruebas
        function runTests() {
            const testResults = document.getElementById('test-results');
            const testOutput = document.getElementById('test-output');
            
            testResults.classList.remove('hidden');
            testOutput.innerHTML = 'Ejecutando pruebas...\n';
            
            // Capturar console.log para mostrar en la página
            const originalLog = console.log;
            const originalError = console.error;
            let output = '';
            
            console.log = function(...args) {
                output += args.join(' ') + '\n';
                originalLog.apply(console, arguments);
            };
            
            console.error = function(...args) {
                output += 'ERROR: ' + args.join(' ') + '\n';
                originalError.apply(console, arguments);
            };
            
            try {
                // Ejecutar las pruebas
                const results = runExpenseManagerTests();
                
                // Restaurar console
                console.log = originalLog;
                console.error = originalError;
                
                // Mostrar resultados
                testOutput.innerHTML = output;
                
                // Scroll al área de resultados
                testResults.scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.log = originalLog;
                console.error = originalError;
                testOutput.innerHTML = output + '\nERROR FATAL: ' + error.message;
            }
        }

        // Función para reiniciar el demo
        function resetDemo() {
            const container = document.getElementById('expense-manager-demo');
            if (container && window.ReactDOM && window.ExpenseManagerDemo) {
                const root = ReactDOM.createRoot(container);
                root.render(React.createElement(ExpenseManagerDemo));
            }
        }

        // Inicializar cuando la página esté cargada
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Inicializando ExpenseManager Test Page...');
            
            // Verificar dependencias
            if (!window.React) {
                console.error('❌ React no está cargado');
                return;
            }
            
            if (!window.ReactDOM) {
                console.error('❌ ReactDOM no está cargado');
                return;
            }
            
            if (!window.ExpenseManager) {
                console.error('❌ ExpenseManager no está cargado');
                return;
            }
            
            if (!window.ExpenseManagerDemo) {
                console.error('❌ ExpenseManagerDemo no está cargado');
                return;
            }
            
            // Renderizar el demo
            resetDemo();
            
            console.log('✅ ExpenseManager Test Page inicializada correctamente');
            
            // Mostrar información de componentes cargados
            console.log('📦 Componentes disponibles:');
            console.log('  • ExpenseManager:', typeof window.ExpenseManager);
            console.log('  • ExpenseManagerDemo:', typeof window.ExpenseManagerDemo);
            console.log('  • runExpenseManagerTests:', typeof window.runExpenseManagerTests);
        });

        // Manejar errores globales
        window.addEventListener('error', function(event) {
            console.error('❌ Error global:', event.error);
        });

        // Información adicional para debugging
        console.log('🔧 ExpenseManager Test Environment');
        console.log('  • React version:', React.version);
        console.log('  • User Agent:', navigator.userAgent);
        console.log('  • Viewport:', window.innerWidth + 'x' + window.innerHeight);
    </script>
</body>
</html>
