<!DOCTYPE html>
<html>
<head>
    <title>Test CalculationEngine</title>
</head>
<body>
    <h1>Test CalculationEngine</h1>
    <div id="result"></div>
    
    <script src="./reconciliation/types.js"></script>
    <script src="./reconciliation/calculation-engine.js"></script>
    
    <script>
        console.log('Testing CalculationEngine...');
        
        // Verificar si se cargó
        if (typeof window.CalculationEngine !== 'undefined') {
            console.log('✅ CalculationEngine cargado correctamente');
            document.getElementById('result').innerHTML = '✅ CalculationEngine cargado correctamente';
            
            // Probar instanciación
            try {
                const engine = new window.CalculationEngine();
                console.log('✅ CalculationEngine instanciado correctamente');
                document.getElementById('result').innerHTML += '<br>✅ CalculationEngine instanciado correctamente';
                
                // Probar método básico
                const commission = engine.calculateCommission(100, 'freenow');
                console.log('✅ Método calculateCommission funciona:', commission);
                document.getElementById('result').innerHTML += '<br>✅ Método calculateCommission funciona: ' + commission;
                
            } catch (error) {
                console.error('❌ Error instanciando CalculationEngine:', error);
                document.getElementById('result').innerHTML += '<br>❌ Error instanciando: ' + error.message;
            }
            
        } else {
            console.error('❌ CalculationEngine no se cargó');
            document.getElementById('result').innerHTML = '❌ CalculationEngine no se cargó';
        }
    </script>
</body>
</html>
