<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Control de Taxi</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-900">👤 Mi Perfil</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="goBackToMain()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">
                        ← Volver
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Información del Usuario -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Información Personal</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                    <input type="text" id="profile-name" readonly
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="profile-email" readonly
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                    <input type="tel" id="profile-phone" readonly
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Rol</label>
                    <input type="text" id="profile-role" readonly
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                </div>
            </div>
            
            <!-- Información específica del taxista -->
            <div id="profile-taxista-info" class="mt-4 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Número de Taxista</label>
                        <input type="text" id="profile-taxista-number" readonly
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
                        <input type="text" id="profile-status" readonly
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                    </div>
                </div>
            </div>
            
            <!-- Información específica del patrón -->
            <div id="profile-patron-info" class="mt-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Código de Invitación</label>
                    <div class="flex">
                        <input type="text" id="profile-invitation-code" readonly
                               class="flex-1 px-3 py-2 border border-gray-300 rounded-l-lg bg-gray-50">
                        <button onclick="copyInvitationCode()" class="px-4 py-2 bg-blue-600 text-white rounded-r-lg hover:bg-blue-700 transition-colors">
                            📋 Copiar
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Comparte este código con los taxistas para que se unan a tu flota</p>
                </div>
            </div>
        </div>

        <!-- Cambio de Contraseña -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Cambiar Contraseña</h2>
            <form id="change-password-form">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña Actual</label>
                        <input type="password" id="current-password" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nueva Contraseña</label>
                        <input type="password" id="new-password" required minlength="6"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-xs text-gray-500 mt-1">Mínimo 6 caracteres</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar Nueva Contraseña</label>
                        <input type="password" id="confirm-new-password" required minlength="6"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex space-x-4 mt-6">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        🔒 Cambiar Contraseña
                    </button>
                    <button type="button" onclick="clearPasswordForm()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition-colors">
                        Limpiar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Messages -->
    <div id="message-container" class="fixed top-4 right-4 z-50"></div>

    <script>
        let currentUser = null;

        // Inicializar la aplicación
        document.addEventListener('DOMContentLoaded', function() {
            currentUser = JSON.parse(localStorage.getItem('taxi_auth_current_user') || '{}');
            
            if (!currentUser.id) {
                showMessage('Debes iniciar sesión para acceder al perfil', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }
            
            loadProfile();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('change-password-form').addEventListener('submit', handleChangePassword);
        }

        function loadProfile() {
            // Llenar los datos del perfil
            document.getElementById('profile-name').value = currentUser.nombre || '';
            document.getElementById('profile-email').value = currentUser.email || '';
            document.getElementById('profile-phone').value = currentUser.telefono || '';
            document.getElementById('profile-role').value = currentUser.rol || '';
            
            if (currentUser.rol === 'TAXISTA') {
                document.getElementById('profile-taxista-info').classList.remove('hidden');
                document.getElementById('profile-patron-info').classList.add('hidden');
                document.getElementById('profile-taxista-number').value = currentUser.numeroTaxista || '';
                document.getElementById('profile-status').value = getTaxistaStatus();
            } else if (currentUser.rol === 'PATRON') {
                document.getElementById('profile-patron-info').classList.remove('hidden');
                document.getElementById('profile-taxista-info').classList.add('hidden');
                document.getElementById('profile-invitation-code').value = currentUser.codigoInvitacion || '';
            }
        }

        function getTaxistaStatus() {
            const users = JSON.parse(localStorage.getItem('taxi_users') || '[]');
            const currentTaxista = users.find(u => u.id === currentUser.id);
            
            if (!currentTaxista) return 'Independiente';
            
            switch (currentTaxista.estado) {
                case 'solicitando':
                    return 'Solicitud Pendiente';
                case 'asociado':
                    const patron = users.find(u => u.id === currentTaxista.patronId);
                    return `Asociado a ${patron?.nombre || 'Patrón'}`;
                default:
                    return 'Independiente';
            }
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmNewPassword = document.getElementById('confirm-new-password').value;
            
            if (newPassword !== confirmNewPassword) {
                showMessage('Las nuevas contraseñas no coinciden', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('La nueva contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }
            
            try {
                await changePassword(currentUser.email, currentPassword, newPassword);
                showMessage('Contraseña cambiada exitosamente', 'success');
                clearPasswordForm();
            } catch (error) {
                console.error('Change password error:', error);
                showMessage(error.message || 'Error al cambiar la contraseña', 'error');
            }
        }

        async function changePassword(email, currentPassword, newPassword) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const users = JSON.parse(localStorage.getItem('taxi_users') || '[]');
                    const userIndex = users.findIndex(u => u.email === email);
                    
                    if (userIndex === -1) {
                        reject(new Error('Usuario no encontrado'));
                        return;
                    }

                    const user = users[userIndex];
                    
                    if (user.password !== currentPassword) {
                        reject(new Error('La contraseña actual es incorrecta'));
                        return;
                    }

                    // Actualizar contraseña
                    users[userIndex].password = newPassword;
                    localStorage.setItem('taxi_users', JSON.stringify(users));
                    
                    resolve();
                }, 1000);
            });
        }

        function clearPasswordForm() {
            document.getElementById('current-password').value = '';
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-new-password').value = '';
        }

        function copyInvitationCode() {
            const codeInput = document.getElementById('profile-invitation-code');
            codeInput.select();
            codeInput.setSelectionRange(0, 99999); // Para móviles
            
            try {
                document.execCommand('copy');
                showMessage('Código copiado al portapapeles', 'success');
            } catch (err) {
                showMessage('Error al copiar el código', 'error');
            }
        }

        function showMessage(message, type) {
            const container = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            
            messageDiv.className = `p-4 rounded-lg shadow-lg mb-4 ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            messageDiv.textContent = message;
            
            container.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Función para volver a la página principal
        function goBackToMain() {
            if (window.opener) {
                window.opener.location.reload();
                window.close();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
