<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Personal - Control de Taxi</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-900">🚗 Mi Panel Personal</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="window.open('balance-liquidacion.html', '_blank')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors">
                        💰 Balance y Liquidación
                    </button>
                    <button onclick="window.open('services.html', '_blank')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        📋 Gestionar Servicios
                    </button>
                    <button onclick="window.open('new-service.html', '_blank')" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                        ➕ Nuevo Servicio
                    </button>
                    <button onclick="goBackToMain()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">
                        ← Volver
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center mb-6">
                <div class="bg-blue-100 p-4 rounded-full mr-4">
                    <span class="text-3xl">🚗</span>
                </div>
                <div>
                    <h2 id="taxistaName" class="text-2xl font-bold text-gray-900">Cargando...</h2>
                    <p class="text-gray-600">Número de Taxista: <span id="taxistaNumber" class="font-bold text-blue-600">-</span></p>
                    <p class="text-sm text-gray-500">Estado: <span id="taxistaStatus" class="font-semibold">-</span></p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-green-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-green-800">Servicios Hoy</h3>
                    <p id="servicesToday" class="text-3xl font-bold text-green-600">0</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-blue-800">Ingresos Brutos</h3>
                    <p id="grossEarnings" class="text-3xl font-bold text-blue-600">€0</p>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-purple-800">Ingresos Netos</h3>
                    <p id="netEarnings" class="text-3xl font-bold text-purple-600">€0</p>
                </div>
                <div class="bg-orange-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-orange-800">Comisiones</h3>
                    <p id="totalCommissions" class="text-3xl font-bold text-orange-600">€0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-gray-50 p-6 rounded-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Servicios Recientes</h3>
                        <button onclick="window.open('services.html', '_blank')" class="text-blue-600 hover:text-blue-800 text-sm">
                            Ver todos →
                        </button>
                    </div>
                    <div id="recentServices" class="space-y-3">
                        <!-- Los servicios se cargarán aquí -->
                    </div>
                </div>

                <div class="bg-gray-50 p-6 rounded-lg">
                    <h3 class="text-lg font-semibold mb-4">Resumen por Origen</h3>
                    <div id="sourceBreakdown" class="space-y-3">
                        <!-- El desglose por origen se cargará aquí -->
                    </div>
                    
                    <div class="mt-6 p-4 bg-blue-50 rounded-lg">
                        <h4 class="font-semibold text-blue-800 mb-2">Balance de Hoy</h4>
                        <div class="flex justify-between">
                            <span>Ingresos Brutos:</span>
                            <span id="balanceGross" class="font-bold text-green-600">€0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Comisiones:</span>
                            <span id="balanceCommissions" class="font-bold text-red-600">-€0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Propinas:</span>
                            <span id="balanceTips" class="font-bold text-green-600">+€0.00</span>
                        </div>
                        <hr class="my-2">
                        <div class="flex justify-between text-lg font-bold">
                            <span>Total Neto:</span>
                            <span id="balanceNet" class="text-blue-600">€0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allServices = [];

        document.addEventListener('DOMContentLoaded', function() {
            currentUser = JSON.parse(localStorage.getItem('taxi_auth_current_user') || '{}');
            loadUserData();
            loadServices();
        });

        function loadUserData() {
            if (currentUser.nombre) {
                document.getElementById('taxistaName').textContent = currentUser.nombre;
            }
            if (currentUser.numeroTaxista) {
                document.getElementById('taxistaNumber').textContent = currentUser.numeroTaxista;
            }
            
            // Determinar estado del taxista
            const users = JSON.parse(localStorage.getItem('taxi_users') || '[]');
            const userRecord = users.find(u => u.id === currentUser.id);
            let status = 'Independiente';
            
            if (userRecord) {
                switch (userRecord.estado) {
                    case 'solicitando':
                        status = 'Solicitud Pendiente';
                        break;
                    case 'asociado':
                        const patron = users.find(u => u.id === userRecord.patronId);
                        status = `Asociado a ${patron?.nombre || 'Patrón'}`;
                        break;
                    default:
                        status = 'Independiente';
                }
            }
            
            document.getElementById('taxistaStatus').textContent = status;
        }

        function loadServices() {
            allServices = JSON.parse(localStorage.getItem('taxi_services') || '[]');
            
            // Filtrar servicios del usuario actual
            const userServices = allServices.filter(service => service.taxistaId === currentUser.id);
            
            // Filtrar servicios de hoy
            const today = new Date().toDateString();
            const todayServices = userServices.filter(service => {
                const serviceDate = new Date(service.datetime);
                return serviceDate.toDateString() === today;
            });

            updateStatistics(todayServices, userServices);
            renderRecentServices(userServices.slice(-5).reverse()); // Últimos 5 servicios
            renderSourceBreakdown(todayServices);
        }

        function updateStatistics(todayServices, allUserServices) {
            const servicesToday = todayServices.length;
            const grossEarnings = todayServices.reduce((sum, service) => sum + (service.amount || 0), 0);
            const totalCommissions = todayServices.reduce((sum, service) => sum + (service.commission || 0), 0);
            const totalTips = todayServices.reduce((sum, service) => sum + (service.tip || 0), 0);
            const netEarnings = grossEarnings - totalCommissions + totalTips;

            document.getElementById('servicesToday').textContent = servicesToday;
            document.getElementById('grossEarnings').textContent = `€${grossEarnings.toFixed(2)}`;
            document.getElementById('netEarnings').textContent = `€${netEarnings.toFixed(2)}`;
            document.getElementById('totalCommissions').textContent = `€${totalCommissions.toFixed(2)}`;

            // Balance
            document.getElementById('balanceGross').textContent = `€${grossEarnings.toFixed(2)}`;
            document.getElementById('balanceCommissions').textContent = `-€${totalCommissions.toFixed(2)}`;
            document.getElementById('balanceTips').textContent = `+€${totalTips.toFixed(2)}`;
            document.getElementById('balanceNet').textContent = `€${netEarnings.toFixed(2)}`;
        }

        function renderRecentServices(services) {
            const container = document.getElementById('recentServices');
            
            if (services.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <div class="text-4xl mb-2">🚕</div>
                        <p>No hay servicios registrados</p>
                        <button onclick="window.open('new-service.html', '_blank')" 
                                class="mt-2 text-blue-600 hover:text-blue-800 text-sm">
                            Registrar primer servicio →
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = services.map(service => {
                const serviceDate = new Date(service.datetime);
                const sourceIcons = {
                    emisora: '📻',
                    calle: '🚶',
                    uber: '🚗',
                    freenow: '🚕',
                    otro: '📋'
                };

                return `
                    <div class="flex justify-between items-center p-3 bg-white rounded-lg">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                                <span class="text-blue-600 text-sm">${sourceIcons[service.serviceSource] || '🚕'}</span>
                            </div>
                            <div>
                                <h4 class="font-semibold text-sm">${service.origin} → ${service.destination}</h4>
                                <p class="text-xs text-gray-600">
                                    ${serviceDate.toLocaleDateString()} ${serviceDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                </p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-green-600">€${service.netAmount.toFixed(2)}</span>
                            ${service.amount !== service.netAmount ? `<p class="text-xs text-gray-500">Base: €${service.amount.toFixed(2)}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSourceBreakdown(todayServices) {
            const container = document.getElementById('sourceBreakdown');
            
            if (todayServices.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-gray-500">
                        <p class="text-sm">No hay servicios hoy</p>
                    </div>
                `;
                return;
            }

            // Agrupar por origen
            const sourceStats = {};
            const sourceIcons = {
                emisora: '📻',
                calle: '🚶',
                uber: '🚗',
                freenow: '🚕',
                otro: '📋'
            };

            todayServices.forEach(service => {
                const source = service.serviceSource;
                if (!sourceStats[source]) {
                    sourceStats[source] = {
                        count: 0,
                        gross: 0,
                        net: 0,
                        commissions: 0
                    };
                }
                sourceStats[source].count++;
                sourceStats[source].gross += service.amount || 0;
                sourceStats[source].net += service.netAmount || 0;
                sourceStats[source].commissions += service.commission || 0;
            });

            container.innerHTML = Object.entries(sourceStats).map(([source, stats]) => `
                <div class="flex justify-between items-center p-3 bg-white rounded-lg">
                    <div class="flex items-center">
                        <span class="text-xl mr-3">${sourceIcons[source] || '📋'}</span>
                        <div>
                            <h4 class="font-semibold capitalize">${source}</h4>
                            <p class="text-xs text-gray-600">${stats.count} servicio${stats.count !== 1 ? 's' : ''}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-green-600">€${stats.net.toFixed(2)}</span>
                        ${stats.commissions > 0 ? `<p class="text-xs text-red-500">-€${stats.commissions.toFixed(2)}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Función para volver a la página principal
        function goBackToMain() {
            // Intentar cerrar la ventana primero (si fue abierta como popup)
            if (window.opener) {
                window.opener.location.reload();
                window.close();
            } else {
                // Si no es un popup, redirigir a la página principal
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
