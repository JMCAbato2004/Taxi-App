<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="96" height="96" rx="16" fill="#059669"/>
  
  <!-- Taxi simplificado -->
  <g transform="translate(48,35)">
    <!-- Cuerpo -->
    <rect x="-20" y="-5" width="40" height="15" rx="2" fill="#FCD34D"/>
    <!-- Techo -->
    <rect x="-15" y="-10" width="30" height="5" rx="2" fill="#FCD34D"/>
    <!-- Ruedas -->
    <circle cx="-12" cy="12" r="4" fill="#374151"/>
    <circle cx="12" cy="12" r="4" fill="#374151"/>
    <!-- Letrero TAXI -->
    <rect x="-8" y="-15" width="16" height="4" rx="1" fill="#EF4444"/>
  </g>
  
  <!-- Símbolo + (nuevo) -->
  <g transform="translate(48,65)">
    <circle cx="0" cy="0" r="12" fill="white"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#059669" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#059669" stroke-width="2"/>
  </g>
