<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="taxiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bgGradient)"/>
  
  <!-- Taxi principal -->
  <g transform="translate(256,200)">
    <!-- Cuerpo del taxi -->
    <rect x="-80" y="-20" width="160" height="60" rx="8" fill="url(#taxiGradient)"/>
    
    <!-- Techo del taxi -->
    <rect x="-60" y="-40" width="120" height="20" rx="10" fill="url(#taxiGradient)"/>
    
    <!-- Ventanas -->
    <rect x="-55" y="-35" width="25" height="15" rx="2" fill="#E5E7EB"/>
    <rect x="-20" y="-35" width="25" height="15" rx="2" fill="#E5E7EB"/>
    <rect x="15" y="-35" width="25" height="15" rx="2" fill="#E5E7EB"/>
    
    <!-- Ruedas -->
    <circle cx="-50" cy="40" r="18" fill="#374151"/>
    <circle cx="50" cy="40" r="18" fill="#374151"/>
    <circle cx="-50" cy="40" r="12" fill="#6B7280"/>
    <circle cx="50" cy="40" r="12" fill="#6B7280"/>
    
    <!-- Letrero TAXI -->
    <rect x="-25" y="-55" width="50" height="15" rx="3" fill="#EF4444"/>
    <text x="0" y="-45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">TAXI</text>
    
    <!-- Faros -->
    <circle cx="-75" cy="-5" r="6" fill="#FEF3C7"/>
    <circle cx="75" cy="-5" r="6" fill="#FEF3C7"/>
  </g>
  
  <!-- Elementos de control/gestión -->
  <!-- Gráfico de barras (reportes) -->
  <g transform="translate(120,350)">
    <rect x="0" y="20" width="12" height="30" fill="white" opacity="0.9"/>
    <rect x="16" y="10" width="12" height="40" fill="white" opacity="0.9"/>
    <rect x="32" y="0" width="12" height="50" fill="white" opacity="0.9"/>
    <rect x="48" y="15" width="12" height="35" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Símbolo de dinero -->
  <g transform="translate(370,350)">
    <circle cx="0" cy="0" r="25" fill="white" opacity="0.9"/>
    <text x="0" y="8" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="24" font-weight="bold">€</text>
  </g>
  
  <!-- Líneas decorativas -->
  <line x1="80" y1="120" x2="432" y2="120" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="80" y1="400" x2="432" y2="400" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>