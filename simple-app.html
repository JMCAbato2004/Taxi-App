<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Control de Taxi - Aplicación PWA para gestionar servicios y gastos de taxi">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Control Taxi">
    
    <title>🚕 Control de Taxi</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React CDN (Development versions for better error messages) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #059669;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="text-4xl mb-4">🚕</div>
            <div class="loading-spinner mb-4"></div>
            <div class="text-gray-600">Cargando Control de Taxi...</div>
        </div>
    </div>
    
    <!-- React App Container -->
    <div id="root"></div>
    
    <!-- Offline Manager -->
    <script src="./offline-manager.js"></script>
    
    <!-- Main App -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const PLATFORMS = ['Emisora', 'Calle', 'Uber', 'Freenow', 'Cabify', 'Bolt', 'DiDi', 'Otra'];
        const DEFAULT_EXPENSE_CATEGORIES = ['Gasolina', 'Comida', 'Lavado', 'Peajes', 'Mantenimiento'];

        function TaxiControlApp() {
          const [darkMode, setDarkMode] = useState(() => {
            const saved = localStorage.getItem('darkMode');
            return saved ? JSON.parse(saved) : false;
          });
          
          const [view, setView] = useState('home');
          const [editingService, setEditingService] = useState(null);
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          const [syncStatus, setSyncStatus] = useState(null);
          
          const [services, setServices] = useState(() => {
            const saved = localStorage.getItem('services');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [expenses, setExpenses] = useState(() => {
            const saved = localStorage.getItem('expenses');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [expenseCategories, setExpenseCategories] = useState(() => {
            const saved = localStorage.getItem('expenseCategories');
            return saved ? JSON.parse(saved) : DEFAULT_EXPENSE_CATEGORIES;
          });

          useEffect(() => {
            localStorage.setItem('darkMode', JSON.stringify(darkMode));
          }, [darkMode]);

          useEffect(() => {
            localStorage.setItem('services', JSON.stringify(services));
          }, [services]);

          useEffect(() => {
            localStorage.setItem('expenses', JSON.stringify(expenses));
          }, [expenses]);

          useEffect(() => {
            localStorage.setItem('expenseCategories', JSON.stringify(expenseCategories));
          }, [expenseCategories]);

          // Manejar conectividad y offline manager
          useEffect(() => {
            const handleOnline = () => setIsOnline(true);
            const handleOffline = () => setIsOnline(false);
            
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            
            // Escuchar eventos del offline manager
            const handleOfflineManagerUpdate = (event) => {
              const { event: eventType, data } = event.detail;
              
              switch (eventType) {
                case 'sync_start':
                  setSyncStatus('Sincronizando datos...');
                  break;
                case 'sync_complete':
                  setSyncStatus(`Sincronización completa: ${data.successful}/${data.total} elementos`);
                  setTimeout(() => setSyncStatus(null), 3000);
                  break;
                case 'sync_error':
                  setSyncStatus(`Error de sincronización: ${data}`);
                  setTimeout(() => setSyncStatus(null), 5000);
                  break;
                default:
                  break;
              }
            };
            
            window.addEventListener('offlineManagerUpdate', handleOfflineManagerUpdate);
            
            return () => {
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
              window.removeEventListener('offlineManagerUpdate', handleOfflineManagerUpdate);
            };
          }, []);

          // Función para mostrar notificaciones offline
          const showOfflineNotification = (message) => {
            const notification = document.createElement('div');
            notification.className = 'fixed top-20 left-4 right-4 bg-orange-600 text-white p-4 rounded-lg shadow-lg z-50 transform transition-transform duration-300 -translate-y-full';
            notification.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="text-xl">📡</div>
                <div class="flex-1">
                  <div class="font-bold">Modo Offline</div>
                  <div class="text-sm opacity-90">${message}</div>
                </div>
              </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
              notification.classList.remove('-translate-y-full');
            }, 100);
            
            setTimeout(() => {
              notification.classList.add('-translate-y-full');
              setTimeout(() => {
                if (notification.parentNode) {
                  notification.parentNode.removeChild(notification);
                }
              }, 300);
            }, 4000);
          };

          const addService = (service) => {
            const newService = { ...service, id: Date.now() };
            
            if (navigator.onLine) {
              setServices([...services, newService]);
              setEditingService(null);
              setView('home');
            } else {
              if (window.offlineManager) {
                window.offlineManager.saveOfflineData('service', newService, 'create');
                setServices([...services, newService]);
                setEditingService(null);
                setView('home');
                showOfflineNotification('Servicio guardado offline. Se sincronizará cuando haya conexión.');
              }
            }
          };

          const deleteService = (id) => {
            if (window.confirm('¿Seguro que quieres eliminar este servicio?')) {
              const serviceToDelete = services.find(s => s.id === id);
              
              if (navigator.onLine) {
                setServices(services.filter(s => s.id !== id));
              } else {
                if (window.offlineManager && serviceToDelete) {
                  window.offlineManager.saveOfflineData('service', serviceToDelete, 'delete');
                  setServices(services.filter(s => s.id !== id));
                  showOfflineNotification('Servicio eliminado offline. Se sincronizará cuando haya conexión.');
                }
              }
            }
          };

          const addExpense = (expense) => {
            const newExpense = { ...expense, id: Date.now(), timestamp: new Date().toISOString() };
            
            if (navigator.onLine) {
              setExpenses([...expenses, newExpense]);
              setView('home');
            } else {
              if (window.offlineManager) {
                window.offlineManager.saveOfflineData('expense', newExpense, 'create');
                setExpenses([...expenses, newExpense]);
                setView('home');
                showOfflineNotification('Gasto guardado offline. Se sincronizará cuando haya conexión.');
              }
            }
          };

          const getTodayStats = () => {
            const today = new Date().toDateString();
            const todayServices = services.filter(s => 
              new Date(s.startTime).toDateString() === today
            );
            const todayExpenses = expenses.filter(e => 
              new Date(e.timestamp).toDateString() === today
            );

            const income = todayServices.reduce((sum, s) => 
              sum + parseFloat(s.price || 0) + parseFloat(s.tip || 0) + parseFloat(s.extras || 0), 0
            );
            const spent = todayExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

            return {
              services: todayServices.length,
              income: income.toFixed(2),
              expenses: spent.toFixed(2),
              profit: (income - spent).toFixed(2)
            };
          };

          const theme = {
            bg: darkMode ? 'bg-gray-900' : 'bg-gray-50',
            card: darkMode ? 'bg-gray-800' : 'bg-white',
            text: darkMode ? 'text-white' : 'text-gray-900',
            textSecondary: darkMode ? 'text-gray-400' : 'text-gray-600',
            border: darkMode ? 'border-gray-700' : 'border-gray-200',
            input: darkMode ? 'bg-gray-700 text-white' : 'bg-white text-gray-900'
          };

          return (
            <div className={`min-h-screen ${theme.bg} ${theme.text}`}>
              {/* Header */}
              <div className={`${theme.card} border-b ${theme.border} p-4 sticky top-0 z-10`}>
                <div className="flex justify-between items-center max-w-4xl mx-auto">
                  <div className="flex items-center gap-3">
                    <h1 className="text-2xl font-bold">🚕 Control de Taxi</h1>
                    {!isOnline && (
                      <div className="flex items-center gap-2 bg-orange-600 text-white px-3 py-1 rounded-full text-sm">
                        <div className="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                        Offline
                      </div>
                    )}
                    {syncStatus && (
                      <div className="flex items-center gap-2 bg-blue-600 text-white px-3 py-1 rounded-full text-sm">
                        <div className="w-2 h-2 bg-white rounded-full animate-spin"></div>
                        {syncStatus}
                      </div>
                    )}
                  </div>
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2 rounded-lg hover:bg-gray-700"
                  >
                    {darkMode ? '☀️' : '🌙'}
                  </button>
                </div>
              </div>

              {/* Main Content */}
              <div className="max-w-4xl mx-auto p-4 pb-24">
                {view === 'home' && (
                  <HomeView 
                    theme={theme} 
                    stats={getTodayStats()} 
                    setView={setView} 
                    services={services}
                    onDelete={deleteService}
                  />
                )}
                {view === 'newService' && (
                  <NewServiceView 
                    theme={theme} 
                    onSave={addService}
                    onCancel={() => setView('home')}
                  />
                )}
                {view === 'newExpense' && (
                  <NewExpenseView 
                    theme={theme} 
                    categories={expenseCategories}
                    onSave={addExpense}
                    onCancel={() => setView('home')}
                  />
                )}
                {view === 'reports' && (
                  <ReportsView theme={theme} />
                )}
              </div>

              {/* Navigation */}
              <div className={`fixed bottom-0 left-0 right-0 ${theme.card} border-t ${theme.border} p-4`}>
                <div className="max-w-4xl mx-auto grid grid-cols-3 gap-2">
                  <NavButton label="Inicio" active={view === 'home'} onClick={() => setView('home')} theme={theme} />
                  <NavButton label="Reportes" active={view === 'reports'} onClick={() => setView('reports')} theme={theme} />
                  <NavButton label="Ajustes" active={view === 'settings'} onClick={() => setView('settings')} theme={theme} />
                </div>
              </div>

              {/* Floating Action Button */}
              {view === 'home' && (
                <button
                  onClick={() => setView('newService')}
                  className="fixed bottom-24 right-6 bg-green-600 hover:bg-green-700 text-white rounded-full p-6 shadow-2xl transition-transform hover:scale-110"
                >
                  ➕
                </button>
              )}
            </div>
          );
        }

        // Componentes auxiliares
        function HomeView({ theme, stats, setView, services, onDelete }) {
          const today = new Date().toDateString();
          const todayServices = services.filter(s => 
            new Date(s.startTime).toDateString() === today
          ).slice(-5).reverse();

          return (
            <div className="space-y-6">
              {/* Stats Cards */}
              <div className="grid grid-cols-2 gap-4">
                <StatCard theme={theme} label="Servicios Hoy" value={stats.services} />
                <StatCard theme={theme} label="Ingresos" value={`€${stats.income}`} color="text-green-600" />
                <StatCard theme={theme} label="Gastos" value={`€${stats.expenses}`} color="text-red-600" />
                <StatCard theme={theme} label="Beneficio" value={`€${stats.profit}`} color="text-blue-600" />
              </div>

              {/* Recent Services */}
              {todayServices.length > 0 && (
                <div className={`${theme.card} rounded-xl p-6 border ${theme.border}`}>
                  <h3 className="text-lg font-bold mb-4">Últimos Servicios</h3>
                  <div className="space-y-3">
                    {todayServices.map(service => (
                      <ServiceCard 
                        key={service.id} 
                        service={service} 
                        theme={theme}
                        onDelete={() => onDelete(service.id)}
                      />
                    ))}
                  </div>
                </div>
              )}

              {/* Add Expense Button */}
              <button
                onClick={() => setView('newExpense')}
                className={`w-full ${theme.card} border ${theme.border} rounded-xl p-6 text-left hover:bg-opacity-80`}
              >
                <div className="flex items-center gap-4">
                  <span className="text-2xl">🧾</span>
                  <span className="text-lg font-semibold">Registrar Gasto</span>
                </div>
              </button>
            </div>
          );
        }

        function StatCard({ theme, label, value, color = theme.text }) {
          return (
            <div className={`${theme.card} rounded-xl p-6 border ${theme.border}`}>
              <div className="flex items-center justify-between mb-2">
                <span className={`text-sm ${theme.textSecondary}`}>{label}</span>
              </div>
              <div className={`text-2xl font-bold ${color}`}>
                {value}
              </div>
            </div>
          );
        }

        function ServiceCard({ service, theme, onDelete }) {
          const total = parseFloat(service.price || 0) + parseFloat(service.tip || 0) + parseFloat(service.extras || 0);
          
          return (
            <div className={`p-4 rounded-lg border ${theme.border}`}>
              <div className="flex justify-between items-start mb-2">
                <span className="font-bold">{service.platform}</span>
                <div className="flex items-center gap-2">
                  <span className="text-green-600 font-bold">
                    €{total.toFixed(2)}
                  </span>
                  <button onClick={onDelete} className="text-red-500 hover:text-red-400 p-1">
                    🗑️
                  </button>
                </div>
              </div>
              <div className={`text-sm ${theme.textSecondary}`}>
                {new Date(service.startTime).toLocaleString()}
              </div>
            </div>
          );
        }

        function NavButton({ label, active, onClick, theme }) {
          return (
            <button
              onClick={onClick}
              className={`flex flex-col items-center justify-center p-3 rounded-lg transition-colors ${
                active 
                  ? 'bg-blue-600 text-white' 
                  : `${theme.textSecondary} hover:${theme.text} hover:bg-opacity-10 hover:bg-gray-500`
              }`}
            >
              <span className="text-xs font-medium">{label}</span>
            </button>
          );
        }

        function NewServiceView({ theme, onSave, onCancel }) {
          const [formData, setFormData] = useState({
            platform: 'Emisora',
            price: '',
            tip: '',
            extras: '',
            startTime: new Date().toISOString().slice(0, 16),
            endTime: new Date().toISOString().slice(0, 16),
            origin: '',
            destination: ''
          });

          const handleSave = () => {
            if (formData.price) {
              onSave(formData);
            } else {
              alert('El precio es obligatorio');
            }
          };

          return (
            <div>
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold">Nuevo Servicio</h2>
                <button onClick={onCancel} className="p-2 hover:bg-gray-700 rounded-lg">
                  ❌
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className={`block mb-2 ${theme.textSecondary}`}>Plataforma *</label>
                  <select
                    value={formData.platform}
                    onChange={(e) => setFormData({ ...formData, platform: e.target.value })}
                    className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`}
                  >
                    {PLATFORMS.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>

                <div>
                  <label className={`block mb-2 ${theme.textSecondary}`}>Precio (€) *</label>
                  <input
                    type="number"
                    step="0.01"
                    value={formData.price}
                    onChange={(e) => setFormData({ ...formData, price: e.target.value })}
                    className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`}
                    placeholder="15.50"
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className={`block mb-2 ${theme.textSecondary}`}>Propina (€)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={formData.tip}
                      onChange={(e) => setFormData({ ...formData, tip: e.target.value })}
                      className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border}`}
                      placeholder="2.00"
                    />
                  </div>
                  <div>
                    <label className={`block mb-2 ${theme.textSecondary}`}>Extras (€)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={formData.extras}
                      onChange={(e) => setFormData({ ...formData, extras: e.target.value })}
                      className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border}`}
                      placeholder="3.50"
                    />
                  </div>
                </div>

                <button
                  onClick={handleSave}
                  className="w-full bg-green-600 hover:bg-green-700 text-white p-5 rounded-xl text-lg font-bold mt-6"
                >
                  Guardar Servicio
                </button>
              </div>
            </div>
          );
        }

        function NewExpenseView({ theme, categories, onSave, onCancel }) {
          const [formData, setFormData] = useState({
            category: categories[0],
            amount: '',
            notes: ''
          });

          const handleSave = () => {
            if (formData.amount && formData.category) {
              onSave(formData);
            } else {
              alert('El importe y la categoría son obligatorios');
            }
          };

          return (
            <div>
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold">Nuevo Gasto</h2>
                <button onClick={onCancel} className="p-2 hover:bg-gray-700 rounded-lg">
                  ❌
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className={`block mb-2 ${theme.textSecondary}`}>Categoría *</label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`}
                  >
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <div>
                  <label className={`block mb-2 ${theme.textSecondary}`}>Importe (€) *</label>
                  <input
                    type="number"
                    step="0.01"
                    value={formData.amount}
                    onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                    className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border} text-lg`}
                    placeholder="25.00"
                  />
                </div>

                <div>
                  <label className={`block mb-2 ${theme.textSecondary}`}>Notas</label>
                  <textarea
                    value={formData.notes}
                    onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                    className={`w-full p-4 rounded-lg ${theme.input} border ${theme.border}`}
                    rows="3"
                    placeholder="Detalles del gasto..."
                  />
                </div>

                <button
                  onClick={handleSave}
                  className="w-full bg-red-600 hover:bg-red-700 text-white p-5 rounded-xl text-lg font-bold mt-6"
                >
                  Guardar Gasto
                </button>
              </div>
            </div>
          );
        }

        function ReportsView({ theme }) {
          return (
            <div className="text-center p-8">
              <h2 className="text-2xl font-bold mb-4">📊 Reportes</h2>
              <p className={theme.textSecondary}>Funcionalidad de reportes en desarrollo</p>
            </div>
          );
        }

        // Renderizar la aplicación
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('loading-screen').style.display = 'none';
          ReactDOM.render(<TaxiControlApp />, document.getElementById('root'));
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./sw.js');
                    console.log('✅ Service Worker registrado:', registration.scope);
                } catch (error) {
                    console.error('❌ Error registrando Service Worker:', error);
                }
            });
        }
    </script>
</body>
</html>
