<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Test Básico</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="text-4xl mb-4">🚕</div>
            <div class="text-gray-600">Cargando...</div>
        </div>
    </div>
    
    <!-- React App Container -->
    <div id="root"></div>
    
    <script>
        console.log('🚀 Iniciando test básico...');
        
        // Verificar que React está disponible
        if (typeof React === 'undefined') {
            console.error('❌ React no está disponible');
            document.body.innerHTML = '<h1>Error: React no cargó</h1>';
        } else {
            console.log('✅ React disponible');
        }
        
        if (typeof ReactDOM === 'undefined') {
            console.error('❌ ReactDOM no está disponible');
            document.body.innerHTML = '<h1>Error: ReactDOM no cargó</h1>';
        } else {
            console.log('✅ ReactDOM disponible');
        }
        
        const { createElement: e } = React;
        
        function TestApp() {
            console.log('📱 Renderizando TestApp...');
            return e('div', { className: "p-8" },
                e('h1', { className: "text-3xl font-bold text-green-600" }, '🚕 Control de Taxi'),
                e('p', { className: "mt-4 text-gray-600" }, 'Aplicación funcionando correctamente'),
                e('button', { 
                    className: "mt-4 bg-blue-600 text-white px-4 py-2 rounded",
                    onClick: () => alert('¡Funciona!')
                }, 'Probar')
            );
        }
        
        // Renderizar inmediatamente
        try {
            console.log('🎯 Ocultando loading...');
            document.getElementById('loading-screen').style.display = 'none';
            
            console.log('⚛️ Renderizando TestApp...');
            ReactDOM.render(e(TestApp), document.getElementById('root'));
            
            console.log('✅ Test básico completado exitosamente');
        } catch (error) {
            console.error('❌ Error en test básico:', error);
            document.getElementById('loading-screen').innerHTML = `
                <div class="text-center">
                    <div class="text-4xl mb-4">⚠️</div>
                    <div class="text-red-600">Error: ${error.message}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
