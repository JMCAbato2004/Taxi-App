    <script>
        // Mock implementations for demo purposes
        class MockAuthService {
            constructor() {
                this.currentUser = null;
            }

            getCurrentUser() {
                return this.currentUser;
            }

            setCurrentUser(user) {
                this.currentUser = user;
            }
        }

        class MockRoleService {
            constructor() {
                this.users = [];
                this.associations = [];
                this.notifications = [];
            }

            getAssociatedUsers() {
                if (!mockAuthService.currentUser) return [];
                
                const associatedIds = this.associations
                    .filter(a => a.patronId === mockAuthService.currentUser.id && a.activa)
                    .map(a => a.taxistaId);
                
                return this.users.filter(u => associatedIds.includes(u.id));
            }

            searchAvailableTaxistas(searchTerm = '') {
                const associatedIds = this.associations
                    .filter(a => a.activa)
                    .map(a => a.taxistaId);
                
                let available = this.users.filter(u => 
                    u.rol === 'taxista' && 
                    u.activo && 
                    !associatedIds.includes(u.id)
                );

                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    available = available.filter(u =>
                        u.nombre.toLowerCase().includes(term) ||
                        u.email.toLowerCase().includes(term) ||
                        (u.numeroTaxista && u.numeroTaxista.toLowerCase().includes(term))
                    );
                }

                return available.map(u => ({
                    id: u.id,
                    email: u.email,
                    nombre: u.nombre,
                    telefono: u.telefono,
                    numeroTaxista: u.numeroTaxista,
                    fechaCreacion: u.fechaCreacion
                }));
            }

            searchAvailableTaxistasAdvanced(options = {}) {
                let results = this.searchAvailableTaxistas(options.searchTerm);
                
                if (options.sortBy) {
                    results.sort((a, b) => {
                        let aValue = a[options.sortBy];
                        let bValue = b[options.sortBy];
                        
                        if (options.sortBy === 'fechaCreacion') {
                            aValue = new Date(aValue).getTime();
                            bValue = new Date(bValue).getTime();
                        } else {
                            aValue = String(aValue).toLowerCase();
                            bValue = String(bValue).toLowerCase();
                        }
                        
                        const comparison = aValue < bValue ? -1 : aValue > bValue ? 1 : 0;
                        return options.sortOrder === 'desc' ? -comparison : comparison;
                    });
                }
                
                if (options.limit && options.limit > 0) {
                    results = results.slice(0, options.limit);
                }
                
                return results;
            }

            async createAssociation(patronId, taxistaId) {
                const association = {
                    id: 'assoc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 11),
                    patronId,
                    taxistaId,
                    fechaAsociacion: new Date(),
                    activa: true
                };
                
                this.associations.push(association);
                
                // Add notification
                const taxista = this.users.find(u => u.id === taxistaId);
                const patron = this.users.find(u => u.id === patronId);
                
                if (taxista && patron) {
                    this.notifications.push({
                        id: 'notif_' + Date.now(),
                        userId: taxistaId,
                        type: 'association_created',
                        title: 'Nueva Asociación',
                        message: `Has sido asociado con el patrón ${patron.nombre}.`,
                        timestamp: new Date(),
                        read: false
                    });
                    
                    this.notifications.push({
                        id: 'notif_' + Date.now() + '_2',
                        userId: patronId,
                        type: 'association_created',
                        title: 'Asociación Creada',
                        message: `Has asociado exitosamente al taxista ${taxista.nombre} (${taxista.numeroTaxista}).`,
                        timestamp: new Date(),
                        read: false
                    });
                }
                
                return association;
            }

            async removeAssociation(associationId) {
                const association = this.associations.find(a => a.id === associationId);
                if (association) {
                    association.activa = false;
                }
            }

            getAssociationsForPatron(patronId) {
                return this.associations.filter(a => a.patronId === patronId);
            }

            getAssociationStatistics() {
                if (!mockAuthService.currentUser) return null;
                
                const patronAssociations = this.associations.filter(a => 
                    a.patronId === mockAuthService.currentUser.id
                );
                
                const activeAssociations = patronAssociations.filter(a => a.activa);
                
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                
                const recentAssociations = patronAssociations.filter(a => 
                    new Date(a.fechaAsociacion) >= thirtyDaysAgo
                );
                
                return {
                    totalAssociations: patronAssociations.length,
                    activeAssociations: activeAssociations.length,
                    recentAssociations: recentAssociations.length
                };
            }

            getAggregatedDataSummary(data, field = 'amount') {
                if (!data || data.length === 0) {
                    return {
                        totalRecords: 0,
                        totalAmount: 0,
                        averageAmount: 0
                    };
                }
                
                const totalAmount = data.reduce((sum, item) => {
                    const value = item[field];
                    return sum + (typeof value === 'number' ? value : 0);
                }, 0);
                
                return {
                    totalRecords: data.length,
                    totalAmount,
                    averageAmount: data.length > 0 ? totalAmount / data.length : 0
                };
            }

            getNotifications(unreadOnly = false) {
                if (!mockAuthService.currentUser) return [];
                
                let userNotifications = this.notifications.filter(n => 
                    n.userId === mockAuthService.currentUser.id
                );
                
                if (unreadOnly) {
                    userNotifications = userNotifications.filter(n => !n.read);
                }
                
                return userNotifications.sort((a, b) => 
                    new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime()
                );
            }

            markNotificationAsRead(notificationId) {
                const notification = this.notifications.find(n => n.id === notificationId);
                if (notification) {
                    notification.read = true;
                    return true;
                }
                return false;
            }

            getUnreadNotificationCount() {
                return this.getNotifications(true).length;
            }

            getAccessibleUsers() {
                return this.users;
            }
        }

        // Mock patron panel classes (simplified versions)
        class MockPatronPanel {
            constructor(config) {
                this.config = config;
                this.authService = config.authService;
                this.roleService = config.roleService;
                this.dashboardData = null;
                this.reportData = null;
                this.loadData();
            }

            async loadData() {
                const currentUser = this.authService.getCurrentUser();
                if (!currentUser) return;

                const stats = this.roleService.getAssociationStatistics();
                
                this.dashboardData = {
                    patronId: currentUser.id,
                    patronNombre: currentUser.nombre,
                    patronEmail: currentUser.email,
                    totalTaxistasAsociados: stats?.activeAssociations || 0,
                    nuevasAsociacionesMes: stats?.recentAssociations || 0
                };

                // Generate mock service data
                const mockServiceData = this.generateMockServiceData();
                const aggregatedStats = this.roleService.getAggregatedDataSummary(mockServiceData, 'amount');
                
                this.reportData = {
                    totalTaxistas: this.getAssociatedTaxistas().length,
                    activeTaxistas: this.getAssociatedTaxistas().filter(t => t.activo).length,
                    totalServices: aggregatedStats?.totalRecords || 0,
                    totalRevenue: aggregatedStats?.totalAmount || 0,
                    averageServiceValue: aggregatedStats?.averageAmount || 0,
                    monthlyGrowth: Math.floor(Math.random() * 20) - 5,
                    topPerformingTaxistas: this.getTopPerformingTaxistas()
                };
            }

            generateMockServiceData() {
                const mockData = [];
                const associatedTaxistas = this.getAssociatedTaxistas();
                
                associatedTaxistas.forEach(taxista => {
                    const serviceCount = Math.floor(Math.random() * 20) + 5;
                    
                    for (let i = 0; i < serviceCount; i++) {
                        mockData.push({
                            id: `service_${taxista.id}_${i}`,
                            userId: taxista.id,
                            amount: Math.floor(Math.random() * 50) + 10,
                            date: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000)
                        });
                    }
                });
                
                return mockData;
            }

            getTopPerformingTaxistas() {
                return this.getAssociatedTaxistas()
                    .map(taxista => ({
                        id: taxista.id,
                        nombre: taxista.nombre,
                        numeroTaxista: taxista.numeroTaxista || '',
                        totalServices: Math.floor(Math.random() * 25) + 5,
                        totalRevenue: Math.floor(Math.random() * 1000) + 200
                    }))
                    .sort((a, b) => b.totalRevenue - a.totalRevenue)
                    .slice(0, 5);
            }

            getDashboardData() { return this.dashboardData; }
            getReportData() { return this.reportData; }
            getAssociatedTaxistas() { return this.roleService.getAssociatedUsers(); }
            getAvailableTaxistas() { return this.roleService.searchAvailableTaxistas(); }
            getAssociations() { 
                return this.roleService.getAssociationsForPatron(this.authService.getCurrentUser()?.id || '');
            }
            isLoadingData() { return false; }
            getNotifications(unreadOnly) { return this.roleService.getNotifications(unreadOnly); }
            getUnreadNotificationCount() { return this.roleService.getUnreadNotificationCount(); }
            markNotificationAsRead(id) { return this.roleService.markNotificationAsRead(id); }

            async searchTaxistas(filters = {}) {
                return this.roleService.searchAvailableTaxistasAdvanced(filters);
            }

            async createAssociation(taxistaId) {
                try {
                    const currentUser = this.authService.getCurrentUser();
                    if (!currentUser) return false;
                    
                    await this.roleService.createAssociation(currentUser.id, taxistaId);
                    await this.loadData();
                    
                    if (this.config.onSuccess) {
                        this.config.onSuccess('Asociación creada correctamente');
                    }
                    return true;
                } catch (error) {
                    if (this.config.onError) {
                        this.config.onError(error);
                    }
                    return false;
                }
            }

            async removeAssociation(associationId) {
                try {
                    await this.roleService.removeAssociation(associationId);
                    await this.loadData();
                    
                    if (this.config.onSuccess) {
                        this.config.onSuccess('Asociación eliminada correctamente');
                    }
                    return true;
                } catch (error) {
                    if (this.config.onError) {
                        this.config.onError(error);
                    }
                    return false;
                }
            }

            clearFilters() {
                // Mock implementation
            }

            exportReportData() {
                const exportData = {
                    patron: {
                        id: this.authService.getCurrentUser()?.id,
                        nombre: this.authService.getCurrentUser()?.nombre,
                        email: this.authService.getCurrentUser()?.email
                    },
                    dashboard: this.dashboardData,
                    reportData: this.reportData,
                    associations: this.getAssociations(),
                    exportDate: new Date().toISOString()
                };
                
                return JSON.stringify(exportData, null, 2);
            }
        }

        function simulateLogin() {

                showMessage('Primero inicializa el demo y añade datos de ejemplo', 'error');
                return;
            }

            const patron = mockRoleService.users.find(u => u.rol === 'patron');

                showMessage('No hay patrones en los datos de ejemplo', 'error');
                return;
            }

            mockAuthService.setCurrentUser(patron);
            
            // Create and render the patron panel
            createPatronPanel();
            
            console.log('Simulated login as patron:', patron.nombre);
            showMessage(`Sesión iniciada como ${patron.nombre}`, 'success');
        }

                containerId: 'patronPanelContainer',

                roleService: mockRoleService,
                onError: (error) => {
                    console.error('Patron Panel Error:', error);
                    showMessage(error.message || 'Error en el panel', 'error');
                },
                onSuccess: (message) => {
                    console.log('Patron Panel Success:', message);
                    showMessage(message, 'success');

                    primaryColor: '#10b981',
                    secondaryColor: '#059669',
                    backgroundColor: '#f5f5f5',

                }
            };

            // Create mock patron panel
            patronPanel = new MockPatronPanel(config);
            
            // Create simplified UI (since we can't import the full UI component)

        }

        function renderTaxistasTab(taxistas) {
            if (taxistas.length === 0) {

                        </button>

                `;
            }

            return `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="margin: 0;">Taxistas Asociados (${taxistas.length})</h2>
                        <button onclick="showTab('search')" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            ➕ Añadir Taxista
                        </button>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
                        ${taxistas.map(taxista => `
                            <div style="border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden;">
                                <div style="padding: 15px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px;">
                                    <div>
                                        <h3 style="margin: 0; color: #1f2937;">${taxista.nombre}</h3>

                                            🗑️ Desasociar

                                    </div>
                                </div>
                                <div style="padding: 15px;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                        <span style="font-weight: 500; color: #666; font-size: 0.9em;">Email:</span>
                                        <span style="color: #1f2937; font-size: 0.9em;">${taxista.email}</span>
                                    </div>
                                    ${taxista.telefono ? `
                                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                            <span style="font-weight: 500; color: #666; font-size: 0.9em;">Teléfono:</span>

        function renderSearchTab() {
            const availableTaxistas = patronPanel.getAvailableTaxistas();
            
            return `
                <div>
                    <h2 style="margin: 0 0 20px 0;">Buscar Taxistas Disponibles</h2>
                    
                    <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
                        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #333; font-size: 0.9em;">Buscar por nombre, email o número:</label>
                                <input type="text" id="searchTerm" placeholder="Ej: Juan, juan@email.com, TX001" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #333; font-size: 0.9em;">Ordenar por:</label>
                                <select id="sortBy" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                                    <option value="nombre">Nombre</option>
                                    <option value="email">Email</option>
                                    <option value="numeroTaxista">Número Taxista</option>
                                    <option value="fechaCreacion">Fecha Registro</option>
                                </select>
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #333; font-size: 0.9em;">Orden:</label>
                                <select id="sortOrder" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                                    <option value="asc">Ascendente</option>
                                    <option value="desc">Descendente</option>
                                </select>
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="performSearch()" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer;">
                                🔍 Buscar
                            </button>
                            <button onclick="clearSearch()" style="padding: 10px 20px; background: #6b7280; color: white; border: none; border-radius: 5px; cursor: pointer;">
                                🗑️ Limpiar
                            </button>
                        </div>
                    </div>

                    <div>
                        <h3 style="margin: 0 0 20px 0;">Taxistas Disponibles (${availableTaxistas.length})</h3>
                        ${availableTaxistas.length === 0 ? `
                            <div style="text-align: center; padding: 60px 20px; color: #666;">
                                <div style="font-size: 4em; margin-bottom: 20px; opacity: 0.5;">🔍</div>
                                <h3 style="margin: 0 0 10px 0; color: #333;">No se encontraron taxistas disponibles</h3>
                                <p style="margin: 0;">Todos los taxistas registrados ya están asociados o no hay taxistas registrados.</p>
                            </div>
                        ` : `
                            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
                                ${availableTaxistas.map(taxista => `
                                    <div style="border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden;">
                                        <div style="padding: 15px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px;">
                                            <div>
                                                <h3 style="margin: 0; color: #1f2937;">${taxista.nombre}</h3>
                                                <p style="margin: 5px 0 0 0; color: #10b981; font-weight: bold; font-size: 0.9em;">${taxista.numeroTaxista}</p>
                                            </div>
                                            <button onclick="confirmCreateAssociation('${taxista.id}', '${taxista.nombre}', '${taxista.numeroTaxista}')" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer;">
                                                ➕ Asociar
                                            </button>
                                        </div>
                                        <div style="padding: 15px;">
                                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                                <span style="font-weight: 500; color: #666; font-size: 0.9em;">Email:</span>
                                                <span style="color: #1f2937; font-size: 0.9em;">${taxista.email}</span>
                                            </div>
                                            ${taxista.telefono ? `
                                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                                    <span style="font-weight: 500; color: #666; font-size: 0.9em;">Teléfono:</span>
                                                    <span style="color: #1f2937; font-size: 0.9em;">${taxista.telefono}</span>
                                                </div>
                                            ` : ''}
                                            <div style="display: flex; justify-content: space-between;">
                                                <span style="font-weight: 500; color: #666; font-size: 0.9em;">Registrado:</span>
                                                <span style="color: #1f2937; font-size: 0.9em;">${new Date(taxista.fechaCreacion).toLocaleDateString()}</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderReportsTab() {
            const reportData = patronPanel.getReportData();
            
            if (!reportData) {
                return `
                    <div style="text-align: center; padding: 60px 20px; color: #666;">
                        <div style="font-size: 4em; margin-bottom: 20px; opacity: 0.5;">📊</div>
                        <h3 style="margin: 0 0 10px 0; color: #333;">No hay datos de reportes disponibles</h3>
                        <p style="margin: 0;">Los reportes se generarán cuando tengas taxistas asociados con actividad.</p>
                    </div>
                `;
            }

            return `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="margin: 0;">Reportes Agregados</h2>
                        <button onclick="exportReports()" style="padding: 10px 20px; background: #6b7280; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            📥 Exportar
                        </button>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                        <div style="text-align: center; padding: 20px; background: #f9f9f9; border-radius: 8px;">
                            <h4 style="margin: 0 0 10px 0; color: #666; font-size: 0.9em;">Taxistas Activos</h4>
                            <p style="margin: 0; font-size: 2em; font-weight: bold; color: #10b981;">${reportData.activeTaxistas}/${reportData.totalTaxistas}</p>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f9f9f9; border-radius: 8px;">
                            <h4 style="margin: 0 0 10px 0; color: #666; font-size: 0.9em;">Servicios Totales</h4>
                            <p style="margin: 0; font-size: 2em; font-weight: bold; color: #10b981;">${reportData.totalServices}</p>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f9f9f9; border-radius: 8px;">
                            <h4 style="margin: 0 0 10px 0; color: #666; font-size: 0.9em;">Ingresos Totales</h4>
                            <p style="margin: 0; font-size: 2em; font-weight: bold; color: #10b981;">€${reportData.totalRevenue.toFixed(2)}</p>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f9f9f9; border-radius: 8px;">
                            <h4 style="margin: 0 0 10px 0; color: #666; font-size: 0.9em;">Promedio por Servicio</h4>
                            <p style="margin: 0; font-size: 2em; font-weight: bold; color: #10b981;">€${reportData.averageServiceValue.toFixed(2)}</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 30px;">
                        <h3 style="margin: 0 0 15px 0;">Top Taxistas por Rendimiento</h3>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #f9f9f9;">
                                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e5e5e5; font-weight: 600; color: #333;">Taxista</th>
                                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e5e5e5; font-weight: 600; color: #333;">Número</th>
                                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e5e5e5; font-weight: 600; color: #333;">Servicios</th>
                                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e5e5e5; font-weight: 600; color: #333;">Ingresos</th>
                                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e5e5e5; font-weight: 600; color: #333;">Promedio</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${reportData.topPerformingTaxistas.map((taxista, index) => `
                                        <tr>
                                            <td style="padding: 12px; border-bottom: 1px solid #e5e5e5;">
                                                <span style="display: inline-block; background: #10b981; color: white; width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-size: 12px; margin-right: 8px;">#${index + 1}</span>
                                                ${taxista.nombre}
                                            </td>
                                            <td style="padding: 12px; border-bottom: 1px solid #e5e5e5;">${taxista.numeroTaxista}</td>
                                            <td style="padding: 12px; border-bottom: 1px solid #e5e5e5;">${taxista.totalServices}</td>
                                            <td style="padding: 12px; border-bottom: 1px solid #e5e5e5;">€${taxista.totalRevenue.toFixed(2)}</td>
                                            <td style="padding: 12px; border-bottom: 1px solid #e5e5e5;">€${(taxista.totalRevenue / taxista.totalServices).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div>
                        <h3 style="margin: 0 0 15px 0;">Crecimiento Mensual</h3>
                        <div style="display: flex; align-items: center; gap: 15px; padding: 20px; border-radius: 8px; font-size: 1.2em; ${reportData.monthlyGrowth >= 0 ? 'background: #d1fae5; color: #065f46;' : 'background: #fee2e2; color: #991b1b;'}">
                            <span style="font-size: 1.5em;">${reportData.monthlyGrowth >= 0 ? '📈' : '📉'}</span>
                            <span style="font-weight: bold; font-size: 1.3em;">${reportData.monthlyGrowth >= 0 ? '+' : ''}${reportData.monthlyGrowth}%</span>
                            <span>vs. mes anterior</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Tab management functions
        function showTab(tabName) {
            // Update tab buttons
            const buttons = ['taxistas', 'search', 'reports'];
            buttons.forEach(btn => {
                const element = document.getElementById(`tab-${btn}-btn`);
                if (element) {
                    if (btn === tabName) {
                        element.style.background = '#10b981';
                        element.style.color = 'white';
                    } else {
                        element.style.background = 'transparent';
                        element.style.color = '#333';
                    }
                }
            });

            // Update tab content
            const tabContent = document.getElementById('tab-content');
            if (tabContent) {
                switch (tabName) {
                    case 'taxistas':
                        tabContent.innerHTML = renderTaxistasTab(patronPanel.getAssociatedTaxistas());
                        break;
                    case 'search':
                        tabContent.innerHTML = renderSearchTab();
                        break;
                    case 'reports':
                        tabContent.innerHTML = renderReportsTab();
                        break;
                }
            }
        }

        // Action functions
        function refreshDemo() {
            if (patronPanel) {
                patronPanel.loadData();
                createSimplifiedUI();
                showMessage('Datos actualizados', 'success');
            }
        }

        function showNotifications() {
            const notifications = patronPanel.getNotifications();
            let notificationHtml = notifications.length === 0 ? 
                'No tienes notificaciones.' :
                notifications.map(n => `
                    <div style="padding: 10px; border-bottom: 1px solid #eee; ${!n.read ? 'background: #f0f9ff; border-left: 4px solid #10b981;' : ''}">
                        <strong>${n.title}</strong><br>
                        <small style="color: #666;">${new Date(n.timestamp).toLocaleString()}</small><br>
                        ${n.message}
                    </div>
                `).join('');

            alert(`Notificaciones:\n\n${notifications.map(n => `${n.title}: ${n.message}`).join('\n\n')}`);
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchTerm')?.value;
            const sortBy = document.getElementById('sortBy')?.value;
            const sortOrder = document.getElementById('sortOrder')?.value;

            const filters = {
                searchTerm: searchTerm || undefined,
                sortBy: sortBy || 'nombre',
                sortOrder: sortOrder || 'asc'
            };

            patronPanel.searchTaxistas(filters).then(() => {
                showTab('search');
                showMessage('Búsqueda completada', 'success');
            });
        }

        function clearSearch() {
            if (document.getElementById('searchTerm')) document.getElementById('searchTerm').value = '';
            if (document.getElementById('sortBy')) document.getElementById('sortBy').value = 'nombre';
            if (document.getElementById('sortOrder')) document.getElementById('sortOrder').value = 'asc';
            
            patronPanel.clearFilters();
            showTab('search');
        }

        function confirmCreateAssociation(taxistaId, nombre, numeroTaxista) {
            if (confirm(`¿Confirmas que deseas asociar al taxista ${nombre} (${numeroTaxista})?`)) {
                patronPanel.createAssociation(taxistaId).then(success => {
                    if (success) {
                        createSimplifiedUI();
                        showTab('taxistas');
                    }
                });
            }
        }

        function confirmRemoveAssociation(taxistaId, taxistaNombre) {
            // Find the association
            const associations = patronPanel.getAssociations();
            const association = associations.find(a => a.taxistaId === taxistaId);
            
            if (association && confirm(`¿Confirmas que deseas desasociar al taxista ${taxistaNombre}? Esta acción no eliminará su cuenta personal.`)) {
                patronPanel.removeAssociation(association.id).then(success => {
                    if (success) {
                        createSimplifiedUI();
                        showTab('taxistas');
                    }
                });
            }
        }

        function viewTaxistaDetails(taxistaId) {
            const taxista = patronPanel.getAssociatedTaxistas().find(t => t.id === taxistaId);
            if (taxista) {
                alert(`Detalles de ${taxista.nombre}:\n\nEmail: ${taxista.email}\nNúmero: ${taxista.numeroTaxista}\nTeléfono: ${taxista.telefono || 'No especificado'}\n\n(Funcionalidad de detalles completos pendiente de implementación)`);
            }
        }

        function exportReports() {
            try {
                const reportData = patronPanel.exportReportData();
                const blob = new Blob([reportData], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `reporte-patron-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showMessage('Reporte exportado correctamente', 'success');
            } catch (error) {
                showMessage('Error al exportar reporte', 'error');
            }
        }

        // Utility function to show messages
        function showMessage(message, type = 'info') {
            const messageEl = document.createElement('div');
            messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                max-width: 300px;
                animation: slideIn 0.3s ease;
            `;
            
            switch (type) {
                case 'success':
                    messageEl.style.background = '#10b981';
                    break;
                case 'error':
                    messageEl.style.background = '#ef4444';
                    break;
                default:
                    messageEl.style.background = '#3b82f6';
            }
            
            messageEl.textContent = message;
            document.body.appendChild(messageEl);
            
            setTimeout(() => {
                messageEl.remove();
            }, 3000);
        }

        // Initialize demo on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Patron Panel Demo ready');
            showMessage('Demo cargado. Haz clic en "Inicializar Demo" para comenzar.', 'info');
        });
    </script>
